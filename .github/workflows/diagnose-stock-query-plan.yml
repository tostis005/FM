name: Diagnóstico puntual rendimiento Stock sin recepciones
on:
  push:
    branches: [diagnostic/stock-query-plan-20261028]
    paths: [".github/workflows/diagnose-stock-query-plan.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Estadísticas e índices, sin consultar registros comerciales
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
           'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='10s';
          SELECT 'REL|' || c.relname || '|est_rows='||c.reltuples::bigint || '|size='||pg_size_pretty(pg_total_relation_size(c.oid))
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='ampedia' AND c.relname IN ('articulos','fm_recepciones_cabeceras','fm_recepciones_lineas','fm_ventas_cabeceras','fm_ventas_lineas')
          ORDER BY c.relname;
          SELECT 'INDEX|'||t.relname||'|'||i.relname||'|valid='||ix.indisvalid||'|'||pg_get_indexdef(i.oid)
          FROM pg_index ix JOIN pg_class i ON ix.indexrelid=i.oid
          JOIN pg_class t ON ix.indrelid=t.oid
          JOIN pg_namespace n ON n.oid=t.relnamespace
          WHERE n.nspname='ampedia' AND t.relname IN ('articulos','fm_recepciones_cabeceras','fm_recepciones_lineas','fm_ventas_cabeceras','fm_ventas_lineas')
          ORDER BY t.relname,i.relname;
          SELECT 'SELECTIVITY|'||tablename||'|'||attname||'|nullfrac='||round(null_frac::numeric,3)||'|n_distinct='||n_distinct
          FROM pg_stats WHERE schemaname='ampedia' AND tablename IN ('articulos','fm_recepciones_lineas','fm_recepciones_cabeceras') AND attname IN ('farmacia_codigo','articulo_origen_id','stock_actual');
          COMMIT;
          SQL
      - name: EXPLAIN ANALYZE de candidatos con máximo 15 segundos
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
           'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='15s';
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF, SUMMARY ON)
          WITH candidatos AS MATERIALIZED (
           SELECT f.id::text AS pharmacy_id,a.farmacia_codigo,a.origen_id,a.stock_actual
           FROM ampedia.articulos a
           JOIN farmetrica.farmacias f ON f.cliente_slug='ampedia'
             AND upper(btrim(a.farmacia_codigo))=upper(btrim(f.codigo_origen))
             AND f.id=ANY(ARRAY(SELECT id FROM farmetrica.farmacias WHERE cliente_slug='ampedia')::int[])
           WHERE a.stock_actual>0 AND nullif(btrim(a.origen_id),'') IS NOT NULL
             AND NOT EXISTS (
              SELECT 1 FROM ampedia.fm_recepciones_lineas rl
              JOIN ampedia.fm_recepciones_cabeceras rh
               ON rh.farmacia_codigo=rl.farmacia_codigo
                AND rh.sistema_origen=rl.sistema_origen AND rh.documento_id=rl.documento_id
              WHERE rl.farmacia_codigo=a.farmacia_codigo AND rl.articulo_origen_id=a.origen_id
                AND NOT rl.eliminada_logicamente AND rl.cantidad>0 AND coalesce(rl.devuelta,false)=false
                AND rh.lineas_completas AND NOT rh.eliminada_logicamente
                AND lower(btrim(rh.estado)) NOT IN ('anulado','anulada','cancelado','cancelada','void')
                AND rh.fecha>='2024-10-28'::date
             )
           ORDER BY a.stock_actual DESC,f.id,a.origen_id LIMIT 51
          )
          SELECT * FROM candidatos;
          COMMIT;
          SQL
          rc=$?
          echo "STOCK_CANDIDATE_ANALYZE_EXIT=$rc"
          exit 0
      - name: EXPLAIN ANALYZE alternativa por recepciones recientes agrupadas (máximo 15s)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
           'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='15s';
          SET LOCAL work_mem='32MB';
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF, SUMMARY ON)
          WITH recent AS MATERIALIZED (
           SELECT DISTINCT rl.farmacia_codigo,rl.articulo_origen_id
           FROM ampedia.fm_recepciones_cabeceras rh
           JOIN ampedia.fm_recepciones_lineas rl
            ON rh.farmacia_codigo=rl.farmacia_codigo
              AND rh.sistema_origen=rl.sistema_origen AND rh.documento_id=rl.documento_id
           WHERE rh.fecha>='2024-10-28'::date AND rh.lineas_completas
             AND NOT rh.eliminada_logicamente
             AND lower(btrim(rh.estado)) NOT IN ('anulado','anulada','cancelado','cancelada','void')
             AND NOT rl.eliminada_logicamente
             AND rl.cantidad>0 AND coalesce(rl.devuelta,false)=false
          )
          SELECT f.id,a.farmacia_codigo,a.origen_id,a.stock_actual
          FROM ampedia.articulos a
          JOIN farmetrica.farmacias f ON f.cliente_slug='ampedia'
            AND upper(btrim(a.farmacia_codigo))=upper(btrim(f.codigo_origen))
            AND f.id=ANY(ARRAY(SELECT id FROM farmetrica.farmacias WHERE cliente_slug='ampedia')::int[])
          LEFT JOIN recent r ON r.farmacia_codigo=a.farmacia_codigo
             AND r.articulo_origen_id=a.origen_id
          WHERE a.stock_actual>0 AND nullif(btrim(a.origen_id),'') IS NOT NULL
            AND r.farmacia_codigo IS NULL
          ORDER BY a.stock_actual DESC,f.id,a.origen_id LIMIT 51;
          COMMIT;
          SQL
          rc=$?
          echo "STOCK_RECENT_HASH_EXIT=$rc"
          exit 0
