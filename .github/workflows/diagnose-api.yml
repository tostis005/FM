name: Diagnosticar arranque API de Farmetrica

on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar acceso SSH verificado
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Diagnóstico de solo lectura y sin datos de farmacia
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            echo "::group::Contenedores y API"
            docker compose -f compose.yaml -f compose.farmacias.yml ps api web db
            echo "::endgroup::"
            echo "::group::Estado de contenedor"
            docker inspect --format "Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} OOMKilled={{.State.OOMKilled}}" farmawao-api-1
            echo "::endgroup::"
            echo "::group::Errores y rastros técnicos del arranque API"
            docker compose -f compose.yaml -f compose.farmacias.yml logs --tail=250 --no-color api 2>&1 |
              grep -E "Error|error|ERR_|Cannot|Syntax|TypeError|ReferenceError|RangeError|stack|at file:|at Module|Node.js|missing|ECONN|ETIMEDOUT|FATAL|SIGTERM|SIGKILL|not found|undefined|Unhandled" |
              tail -n 65 || true
            echo "::endgroup::"
            echo "::group::Configuración de arranque sin secretos"
            docker inspect --format "Logging={{.HostConfig.LogConfig.Type}} StateError={{.State.Error}}" farmawao-api-1
            echo "::endgroup::"
            echo "::group::Salida corta sin filtrar del contenedor API"
            docker logs --tail=45 farmawao-api-1 2>&1 | tail -n 45 || true
            echo "::endgroup::"
            echo "::group::Comprobar arranque Node en contenedor temporal"
            # Servicio temporal sin publicar puertos ni alterar el contenedor
            # principal. timeout evita quedar escuchando indefinidamente.
            timeout 15 docker compose -f compose.yaml -f compose.farmacias.yml run --rm --no-deps --entrypoint node api src/server.js 2>&1 | tail -n 45 || true
            echo "::endgroup::"
            echo "::group::Salud HTTP"
            curl -sS -m 6 -o /dev/null -w "health HTTP %{http_code}\n" http://127.0.0.1:18080/api/health/database || true
            echo "::endgroup::"
          '
