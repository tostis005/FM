name: Limpiar clave efimera de rotacion no utilizada

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-unused-rotation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Eliminar solo la clave privada temporal no usada
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            rm -f /opt/farmawao/api_backups/.farmawao_rotation_private.pem
            rm -f /opt/farmawao/api_backups/.farmawao_rotation_cipher.txt
            test ! -e /opt/farmawao/api_backups/.farmawao_rotation_private.pem
            echo ROTACION_PENDIENTE_LIMPIEZA_COMPLETADA
          '
