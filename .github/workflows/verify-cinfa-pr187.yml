name: Comprobación final Cinfa en producción
on:
  push:
    branches: ["diag/verify-cinfa-pr187-20261025"]
    paths: [".github/workflows/verify-cinfa-pr187.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar conexión temporal
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/ci
          chmod 600 ~/.ssh/ci
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Identificar tablas e índices de ventas y artículos
        run: |
          set -euo pipefail
          cat <<'SQL' | ssh -i ~/.ssh/ci -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='20000';
          SELECT 'REL',relname,relkind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ampedia' AND c.relname IN ('articulos','fm_ventas_analitica','fm_ventas_lineas','fm_ventas_cabeceras');
          SELECT 'IDX',tablename,indexname,left(indexdef,400) FROM pg_indexes WHERE schemaname='ampedia' AND tablename IN ('articulos','fm_ventas_analitica','fm_ventas_lineas','fm_ventas_cabeceras') ORDER BY tablename,indexname LIMIT 45;
          SELECT 'ROWS',relname,reltuples::bigint FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ampedia' AND c.relname IN ('articulos','fm_ventas_analitica','fm_ventas_lineas','fm_ventas_cabeceras');
          COMMIT;
          SQL
