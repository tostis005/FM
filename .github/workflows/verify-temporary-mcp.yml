name: Verificar MCP temporal en produccion
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar inicializacion y herramientas MCP externas sin token
        shell: bash
        run: |
          set -euo pipefail
          base="https://farmetrica.com/api/consulta-temporal/mcp"
          http=$(curl -sS --max-time 20 -o /tmp/mcp.json -D /tmp/mcp.headers \
            -w '%{http_code}' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$base")
          test "$http" = 200
          grep -qi no-store /tmp/mcp.headers
          python3 - <<'PY'
          import json
          with open("/tmp/mcp.json") as f: result=json.load(f)
          names={t["name"] for t in result["result"]["tools"]}
          assert {"leer_modelo_temporal","consultar_datos_temporales"}<=names
          assert all("inputSchema" in t for t in result["result"]["tools"])
          print("MCP temporal: herramientas genericas disponibles")
          PY
          http=$(curl -sS --max-time 20 -o /tmp/mcp-invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"leer_modelo_temporal","arguments":{"url":"https://farmetrica.com/api/consulta-temporal/fm_share_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}}' "$base")
          test "$http" = 200
          python3 - <<'PY'
          import json
          with open("/tmp/mcp-invalid.json") as f: r=json.load(f)
          assert r["result"]["isError"] is True
          print("MCP temporal: enlace inexistente rechazado")
          PY
          test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$base")" = "405"
          echo "Verificada la pasarela MCP; no se uso ninguna credencial real."
