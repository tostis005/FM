          psql_test --single-transaction < api/src/migrations/052_codigos_visibles.sql
          psql_test --single-transaction < api/src/migrations/053_apariencia_clientes.sql
          psql_test --single-transaction < api/src/migrations/053_apariencia_clientes.sql
          psql_test --single-transaction < api/src/migrations/054_fondo_clientes.sql
          psql_test --single-transaction < api/src/migrations/056_ampedia_fondo_suave.sql
          psql_test --single-transaction < api/src/migrations/057_ampedia_paleta_agua.sql
          psql_test --single-transaction < api/src/migrations/057_ampedia_paleta_agua.sql
          psql_test --single-transaction < api/src/migrations/054_fondo_clientes.sql
          psql_test --single-transaction < api/src/migrations/050_perfiles_globales.sql
