name: Verificar uso de índices en ventas
on:
  push:
    branches: [main]
    paths: [".github/workflows/verificar-planes-ventas.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar acceso PostgreSQL de solo lectura
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Explicar planes de búsquedas reales sin extraer transacciones
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          SET default_transaction_read_only = on;
          SET statement_timeout = '35s';
          SET lock_timeout = '4s';
          \set ON_ERROR_STOP off
          \echo '=== Índices disponibles en producción ==='
          SELECT idx.relname AS indice,tab.relname AS tabla,pi.indisvalid AS valido,pi.indisready AS preparado
            FROM pg_class idx JOIN pg_namespace ns ON ns.oid=idx.relnamespace
            JOIN pg_index pi ON pi.indexrelid=idx.oid
            JOIN pg_class tab ON tab.oid=pi.indrelid
            WHERE ns.nspname='ampedia' AND idx.relname LIKE 'fm_%_idx'
            ORDER BY tab.relname,idx.relname;
          \echo '=== Lock modes que afectan a ampedia.ventas (sin consultas ni datos personales) ==='
          SELECT l.mode,l.granted,coalesce(a.backend_type,'') AS backend_type,
             coalesce(a.application_name,'') AS application,
             a.state,a.wait_event_type,a.wait_event,
             COALESCE(extract(epoch FROM clock_timestamp()-a.xact_start)::int,0) AS transaction_age_seconds
          FROM pg_locks l LEFT JOIN pg_stat_activity a ON a.pid=l.pid
          WHERE l.relation=to_regclass('ampedia.ventas')
          ORDER BY l.granted,l.mode,transaction_age_seconds DESC LIMIT 40;
          \echo '=== Ventas Valdemarías: filtro por código ERP y día ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT count(*),sum(importe)
          FROM ampedia.ventas
          WHERE upper(btrim(farmacia_codigo))='VAL'
            AND fecha >= DATE '2026-10-17' AND fecha < DATE '2026-10-18';
          \echo '=== Ventas Valdemarías: join utilizado por el API ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT count(*),sum(v.importe)
          FROM ampedia.ventas v JOIN farmetrica.farmacias f
            ON f.cliente_slug='ampedia'
            AND upper(btrim(v.farmacia_codigo))=
              (CASE WHEN f.cliente_slug='ampedia' AND f.id=5
                 AND upper(btrim(f.codigo_origen)) IN ('POL','VAL')
                THEN 'VAL' ELSE upper(btrim(f.codigo_origen)) END)
          WHERE f.id=5 AND v.fecha >= DATE '2026-10-17'
            AND v.fecha < DATE '2026-10-18';
          \echo '=== Valdemarías: existencia de ventas reales en los últimos 90 días ==='
          SELECT EXISTS(
            SELECT 1 FROM ampedia.ventas v
            JOIN farmetrica.farmacias f ON f.id=5 AND f.cliente_slug='ampedia'
              AND upper(btrim(v.farmacia_codigo))=
                 (CASE WHEN f.cliente_slug='ampedia' AND f.id=5
                    AND upper(btrim(f.codigo_origen)) IN ('POL','VAL')
                    THEN 'VAL' ELSE upper(btrim(f.codigo_origen)) END)
            WHERE v.fecha>=DATE '2026-07-18' AND v.fecha<DATE '2026-10-19'
              AND btrim(v.articulo_id::text)<>''
          ) AS hay_ventas_y_articulo;
          \echo '=== Valdemarías: existencia de artículo y CN enlazado a ventas ==='
          SELECT EXISTS(
            SELECT 1 FROM ampedia.ventas v
            LEFT JOIN LATERAL(
              SELECT a.origen_id FROM ampedia.articulos a
              WHERE upper(btrim(a.farmacia_codigo))=upper(btrim(v.farmacia_codigo))
                AND a.origen_id=v.articulo_id
              ORDER BY a.sincronizado_en DESC NULLS LAST LIMIT 1
            ) a ON true
            WHERE upper(btrim(v.farmacia_codigo))='VAL'
              AND v.fecha>=DATE '2026-07-18' AND v.fecha<DATE '2026-10-19'
              AND a.origen_id IS NOT NULL
          ) AS articulos_encontrados;
          \echo '=== Plan SUM directo 12 meses Valdemarías sin joins ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT sum(importe),sum(unidades)
          FROM ampedia.ventas
          WHERE upper(btrim(farmacia_codigo))='VAL'
            AND fecha >= DATE '2025-11-01' AND fecha < DATE '2026-10-19';
          \echo '=== Plan SUM por mes 12 meses Valdemarías sin joins ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT date_trunc('month',fecha) AS mes,sum(importe),sum(unidades)
          FROM ampedia.ventas
          WHERE upper(btrim(farmacia_codigo))='VAL'
            AND fecha >= DATE '2025-11-01' AND fecha < DATE '2026-10-19'
          GROUP BY 1;
          \echo '=== Estadísticas planificación (sin datos de movimientos) ==='
          SELECT relname,n_live_tup,n_dead_tup,n_mod_since_analyze,last_analyze,last_autoanalyze,
             seq_scan,idx_scan,pg_size_pretty(pg_relation_size(relid)) AS tabla_bytes
          FROM pg_stat_user_tables WHERE schemaname='ampedia' AND relname='ventas';
          \echo '=== Compras Abadía: filtro por código ERP y día ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT count(*),sum(importe)
          FROM ampedia.compras
          WHERE upper(btrim(farmacia_codigo))='ABA'
            AND fecha >= DATE '2026-10-17' AND fecha < DATE '2026-10-18';
          \echo '=== Catálogo Valdemarías: búsqueda ERP artículo ==='
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          SELECT origen_id FROM ampedia.articulos
          WHERE upper(btrim(farmacia_codigo))='VAL'
          ORDER BY origen_id LIMIT 20;
          SQL
