            WHERE cliente_slug='demo_individual' AND codigo_origen='ALMACEN'" >/dev/null
          psql_test -At -c "UPDATE farmetrica.farmacias SET activo=false
            WHERE cliente_slug='ampedia' AND codigo_origen='ALMACEN'" >/dev/null
          psql_test --single-transaction < api/src/migrations/049_almacen_establecimiento.sql
          test "$(psql_test -At -c "SELECT activo FROM farmetrica.farmacias
            WHERE cliente_slug='ampedia' AND codigo_origen='ALMACEN'")" = f
          psql_test -At -c "UPDATE farmetrica.farmacias SET activo=true
            WHERE cliente_slug='ampedia' AND codigo_origen='ALMACEN'" >/dev/null
          test "$(psql_test -At -c "SELECT count(*) FROM farmetrica.farmacias WHERE cliente_slug='demo_individual' AND activo")" = 1
          test "$(psql_test -At -c "SELECT demo_origen_slug FROM farmetrica.clientes WHERE slug='demo_individual'")" = ampedia
