name: Aplicar nueva contraseña cifrada en Contabo

on:
  push:
    branches: [main]
    paths: ["deploy/rotation-admin-ciphertext.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmawao-admin-credential-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          test -s deploy/rotation-admin-ciphertext.txt
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Transferir unicamente la contraseña cifrada
        run: |
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/rotation-admin-ciphertext.txt \
            "$VPS_USER@$VPS_HOST:/opt/farmawao/api_backups/.farmawao_rotation_cipher.txt"
      - name: Actualizar hash de contraseña exclusivamente en el servidor
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            docker run --rm \
              --mount type=bind,src=/opt/farmawao,dst=/srv \
              --mount type=bind,src=/opt/farmawao/api_backups,dst=/keys \
              node:22-alpine node /srv/api/rotate-password-vps.mjs rotate
            cd /opt/farmawao
            docker compose -f compose.yaml -f compose.farmacias.yml up -d --no-deps api
          '
      - name: Comprobar login real y consultas a PostgreSQL
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            for i in $(seq 1 15); do
              if docker run --rm --network host \
                --mount type=bind,src=/opt/farmawao,dst=/srv,readonly \
                --mount type=bind,src=/opt/farmawao/api_backups,dst=/keys,readonly \
                node:22-alpine node /srv/api/rotate-password-vps.mjs smoke; then exit 0; fi
              sleep 3
            done
            exit 1
          '
      - name: Destruir clave privada y credencial obsoleta
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            docker run --rm \
              --mount type=bind,src=/opt/farmawao,dst=/srv,readonly \
              --mount type=bind,src=/opt/farmawao/api_backups,dst=/keys \
              --mount type=bind,src=/root,dst=/root-host \
              node:22-alpine node /srv/api/rotate-password-vps.mjs cleanup
          '
