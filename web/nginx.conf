# Resolver esquema público tras el proxy TLS, sin asumir el dominio de producción.
map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolver el servicio Docker cuando la API se recree sin reiniciar Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $farmawao_api "api:8000";

  # La API hace su propia comprobación de roles, sesiones y CSRF.
  location /api/ {
    proxy_pass http://$farmawao_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Sitio comercial público, separado de los bundles internos de React.
  # La raíz nunca sirve la SPA privada, ni siquiera con una sesión activa.
  location = / {
    try_files /landing.html =404;
    default_type text/html;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /landing.html { return 404; }
  # Generación dependiente del hostname real: Google requiere URLs absolutas en sitemap.
  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\nDisallow: /login\nDisallow: /promociones\nDisallow: /seguimiento\nDisallow: /farmacias\nDisallow: /usuarios\nDisallow: /accesos\nDisallow: /ajustes\nDisallow: /index.html\nDisallow: /assets/\nSitemap: $public_scheme://$host/sitemap.xml\n";
  }
  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n<url><loc>$public_scheme://$host/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/gestion-promociones-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/objetivos-venta-farmacias/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/seguimiento-ventas-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/cuadro-mando-farmacias/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/reporting-laboratorios/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/grupos-de-farmacias/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/importar-campanas-excel/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/gestion-usuarios-farmacias/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/farmatic/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/nixfarma/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/unycop/</loc></url>\n<url><loc>$public_scheme://$host/blog/</loc></url>\n<url><loc>$public_scheme://$host/blog/presentamos-farmetrica/</loc></url>\n<url><loc>$public_scheme://$host/blog/objetivos-por-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/blog/datos-reales-integraciones/</loc></url>\n<url><loc>$public_scheme://$host/blog/indicadores-promociones-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/blog/errores-al-definir-objetivos/</loc></url>\n<url><loc>$public_scheme://$host/blog/como-preparar-informe-laboratorio/</loc></url>\n<url><loc>$public_scheme://$host/blog/codigos-nacionales-en-promociones/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/business-intelligence-farmacias/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/ventas-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/analisis-compras-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/rentabilidad-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/control-stock-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/reposicion-stock-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/analisis-proveedores-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/comparativa-genericos-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/soluciones/rendimiento-articulos-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/bitfarma/</loc></url>\n<url><loc>$public_scheme://$host/integraciones/farmanager/</loc></url>\n<url><loc>$public_scheme://$host/blog/integrar-farmatic-nixfarma-unycop-analitica/</loc></url>\n<url><loc>$public_scheme://$host/blog/compras-inteligentes-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/blog/stock-inmovilizado-farmacia/</loc></url>\n<url><loc>$public_scheme://$host/blog/rentabilidad-por-articulo/</loc></url>\n<url><loc>$public_scheme://$host/blog/estrategia-genericos-farmacia/</loc></url>\n</urlset>\n";
  }
  # Logo corporativo compartido por el sitio público, acceso y SPA privada.
  location = /brand-symbol.svg {
    try_files /brand-symbol.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /favicon.svg {
    try_files /favicon.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /marketing.css {
    try_files /marketing.css =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /soluciones { return 301 /soluciones/; }
  location ^~ /soluciones/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /integraciones { return 301 /integraciones/; }
  location ^~ /integraciones/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /blog { return 301 /blog/; }
  location ^~ /blog/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Inicio de sesión público; los datos y la SPA continúan protegidos.
  location = /login {
    alias /usr/share/nginx/html/login.html;
    # /login no tiene extension; por defecto Nginx responde octet-stream.
    # Servir siempre como HTML para evitar que el navegador descargue login.bin.
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /login.html { return 404; }
  location = /favicon.ico { return 404; }

  location = /__authcheck {
    internal;
    proxy_pass http://$farmawao_api/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location @login_redirect {
    return 302 /login?next=$request_uri;
  }

  # Todas las rutas de la SPA, sus bundles JS/CSS y activos privados requieren cookie válida.
  # Sin backend disponible, Nginx no entrega la aplicación (fail closed).
  location / {
    auth_request /__authcheck;
    error_page 401 = @login_redirect;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
