name: Build and deploy Farmetrica SaaS

on:
  push:
    branches: [main, preview/farmetrica-v1]
    paths: ["web/**", "api/**", "deploy/**", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "api/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmawao-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar API
        run: |
          npm install --prefix api --no-audit --no-fund
          node --check api/src/server.js
          node --check api/src/accesos.js
          node --check api/src/tenant.js
          node --check api/src/syncStatus.js
          node --check api/src/promocionesTenant.js
          node --check api/src/genericos.js
          node --check api/src/genericosReales.js
          node --check api/src/realReports.js
          node --check api/src/purchaseTotals.js
          node --test api/src/purchaseTotals.test.js
          node --check api/src/salesSummary.js
          node --check api/src/salesTotals.js
          node --check api/src/salesInsights.js
          node --check api/src/salesDetail.js
          node --check api/src/salesCache.js
          node --test api/src/salesCache.test.js
          node --test api/src/pharmacyCodes.test.js
          node --check api/src/pricePolicy.js
          node --test api/src/pricePolicy.test.js
          node --test api/src/abcd.test.js
          node --test api/src/realReports.test.js
          node --test api/src/reportTableFilters.test.js
          node --test api/src/salesSummary.test.js
          node --test api/src/salesTotals.test.js
          node --test api/src/salesInsights.test.js
          node --test api/src/salesAnalysisPeriod.test.js
          node --test api/src/tenantAnalysisPolicy.test.js
          node --test api/src/internalPassword.test.js
          node --test api/src/salesDetail.test.js
          node --test api/src/genericos.test.js
          node --check api/src/publicLeads.js
          node --check api/src/privacyRequests.js
          node --test api/src/publicLeads.test.js api/src/privacyRequests.test.js
      - name: Instalar y compilar web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node --test src/cns.test.js src/importarPromociones.test.js src/objetivosImportacion.test.js src/listLogic.test.js src/laboratoryExport.test.js
          node --test src/businessAnalytics.test.js
          node --test src/promotionMetrics.test.js
          node --test src/salesPeriods.test.js
          node --test src/localeES.test.js
          node check-login.mjs
          node generate-seo.mjs
          node check-seo.mjs
          node check-marketing.mjs
          node check-public-links.mjs
          npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Verificaciones previas sin modificar datos
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            test -f compose.yaml && test -d api && test -d web && test -f .env
            test -w api && test -w web
            docker compose config --quiet
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT count(*) FROM public.farmacias WHERE id BETWEEN 1 AND 5;" | grep -qx 5
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT CASE WHEN EXISTS(
                SELECT 1 FROM information_schema.columns WHERE table_schema IN ('\''farmatic'\'','\''ampedia'\'')
                AND ((table_name='\''lineaventa'\'' AND column_name='\''farmacia_origen'\'')
                  OR (table_name='\''ventas'\'' AND column_name='\''farmacia_codigo'\''))
              ) THEN 1 ELSE 0 END;" | grep -qx 1
          '

      - name: Aplicar migraciones aditivas transaccionales
        run: |
          set -euo pipefail
          for migration in 001_farmacias.sql 002_accesos.sql 003_multitenant.sql 012_analisis_ventas_cliente.sql 013_accesos_locales.sql 014_clientes_demo.sql 015_cache_analitica_ventas.sql 005_proveedores.sql 006_solicitudes_demo.sql 007_solicitudes_privacidad.sql; do
            ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 --single-transaction -U farmawao -d farmawao' \
              < "api/src/migrations/$migration"
          done
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            cd /opt/farmawao
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT count(*) FROM farmetrica.superadministradores WHERE email='\''jose.fraga@gmail.com'\'';" | grep -qx 1
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT count(*) FROM farmetrica.cliente_modulos WHERE cliente_slug='\''ampedia'\'' AND habilitado AND modulo_clave='\''promociones'\'';" | grep -qx 1
          '

      - name: Renombrar farmatic a ampedia de forma transaccional
        run: |
          set -euo pipefail
          state=$(ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            cd /opt/farmawao
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT CASE WHEN
                          (to_regclass('\''ampedia.lineaventa'\'') IS NOT NULL
                           OR to_regclass('\''ampedia.ventas'\'') IS NOT NULL)
                          AND EXISTS (SELECT 1 FROM farmetrica.clientes
                            WHERE slug='\''ampedia'\'' AND esquema_datos='\''ampedia'\'')
                      THEN '\''ALREADY'\'' WHEN to_regclass('\''farmatic.lineaventa'\'') IS NOT NULL
                          AND to_regclass('\''ampedia.lineaventa'\'') IS NULL THEN '\''RENAME'\'' ELSE '\''BLOCK'\'' END;"
          ')
          if [ "$state" = "RENAME" ]; then
            ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U farmawao -d farmawao' \
              < api/src/migrations/004_ampedia_cutover_MANUAL.sql
          elif [ "$state" != "ALREADY" ]; then
            echo "::error::Estado inesperado de los esquemas. No se altera la base de datos."
            exit 1
          fi

      - name: Preparar conservación de promociones de Ampedia
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 --single-transaction -U farmawao -d farmawao' \
            < api/src/migrations/009_promociones_cliente.sql

      - name: Preparar catálogo de genéricos aditivo
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 --single-transaction -U farmawao -d farmawao' < api/src/migrations/010_nomenclator_aemps.sql

      - name: Configurar política comercial de percentiles
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 --single-transaction -U farmawao -d farmawao' < api/src/migrations/011_configuracion_precios.sql

      - name: Actualizar API y web en el VPS
        run: |
          set -euo pipefail
          tar -czf - -C api . | ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'set -eu; cd /opt/farmawao; STAGING=$(mktemp -d); trap "rm -rf \"$STAGING\"" EXIT; tar -xzf - -C "$STAGING"; cp -r "$STAGING"/. api/'
          tar -czf - -C web --exclude=node_modules --exclude=dist . | \
            ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'set -eu; cd /opt/farmawao; STAGING=$(mktemp -d); trap "rm -rf \"$STAGING\"" EXIT; tar -xzf - -C "$STAGING"; cp -r "$STAGING"/. web/'
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/compose.farmacias.yml "$VPS_USER@$VPS_HOST:/opt/farmawao/compose.farmacias.yml"
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/compose.asistente.yml "$VPS_USER@$VPS_HOST:/opt/farmawao/compose.asistente.yml"
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            cd /opt/farmawao
            docker compose -f compose.yaml -f compose.farmacias.yml config --quiet
            docker compose -f compose.yaml -f compose.farmacias.yml up -d --build --no-deps api web
          '

      - name: Comprobar API, PostgreSQL y rutas web
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao \
              -c "SELECT esquema_datos FROM farmetrica.clientes WHERE slug='\''ampedia'\'';" | grep -qx ampedia
            for i in $(seq 1 30); do
              api=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/api/health/database || true)
              web=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ || true)
              login=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/login || true)
              panel=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/promociones || true)
              solutions=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/soluciones/ || true)
              solution=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/soluciones/gestion-promociones-farmacia/ || true)
              integration=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/integraciones/nixfarma/ || true)
              blog=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/blog/indicadores-promociones-farmacia/ || true)
              sitemap=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/sitemap.xml || true)
              demo=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/solicitar-demo/ || true)
              rejected=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" --data "{}" http://127.0.0.1:18080/api/public/solicitudes-demo || true)
              if [ "$api" = 200 ] && [ "$web" = 200 ] && [ "$login" = 200 ] && [ "$panel" = 302 ] && [ "$solutions" = 200 ] && [ "$solution" = 200 ] && [ "$integration" = 200 ] && [ "$blog" = 200 ] && [ "$sitemap" = 200 ] && [ "$demo" = 200 ] && [ "$rejected" = 400 ]; then
                if curl -fsS http://127.0.0.1:18080/api/health/database | grep -q connected && \
                   curl -fsS http://127.0.0.1:18080/soluciones/gestion-promociones-farmacia/ | grep -q "Farmetrica" && \
                   curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q "<urlset" && \
                   ! curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q "__FARMETRICA_SITE_ORIGIN__" && \
                   curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q "<loc>http://127.0.0.1" && \
                   curl -fsS http://127.0.0.1:18080/robots.txt | grep -q "Sitemap: http://127.0.0.1/sitemap.xml" && \
                   curl -fsS http://127.0.0.1:18080/ | grep -q "class=\"fm-emblem\""  && \
                   curl -fsS http://127.0.0.1:18080/login | grep -q "class=\"fm-emblem\""  && \
                   curl -fsS http://127.0.0.1:18080/marketing.css?v=7 | grep -q ".fm-emblem" && \
                   curl -fsS http://127.0.0.1:18080/brand-logo.webp?v=4 | head -c 4 | grep -q "RIFF" && \
                   curl -fsS http://127.0.0.1:18080/solicitar-demo/ | grep -q "demo-request-form" && \
                   curl -fsS http://127.0.0.1:18080/metricas.js | grep -q "api/public/metricas" && \
                   [ "$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/api/admin/metricas-web)" != 200 ]; then
                  # Comprobar absolutamente todas las páginas del sitemap y las integraciones.
                  routes=$(curl -fsS http://127.0.0.1:18080/sitemap.xml | python3 -c "import sys, xml.etree.ElementTree as ET, urllib.parse as U; print(chr(32).join(U.urlsplit(e[0].text).path for e in ET.parse(sys.stdin).getroot()))")
                  test -n "$routes"
                  for path in $routes /integraciones/farmatic/ /integraciones/nixfarma/ /integraciones/unycop/ /integraciones/bitfarma/ /integraciones/farmanager/ /privacidad/ /privacidad/solicitud/; do
                    status=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080$path" || true)
                    if [ "$status" != 200 ]; then echo "::error::Enlace público roto: $path (HTTP $status)"; exit 1; fi
                  done
                  exit 0
                fi
              fi
              sleep 3
            done
            echo "::error::Falló el chequeo HTTP: API=$api web=$web login=$login privada=$panel soluciones=$solutions ficha=$solution ERP=$integration blog=$blog sitemap=$sitemap demo=$demo rechazado=$rejected"
            echo "Falló la comprobación posterior del despliegue"
            exit 1
          '
