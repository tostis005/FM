name: Auditar contrato de datos operativos
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-data-model.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar conexión de solo lectura
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Mostrar estructura y disponibilidad por tabla, nunca filas comerciales
        run: |
          ssh -i ~/.ssh/id_fm -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
           'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao -c "
              SELECT table_name, string_agg(column_name||chr(58)||data_type,chr(44) ORDER BY ordinal_position) AS columnas
              FROM information_schema.columns
              WHERE table_schema=(SELECT esquema_datos FROM farmetrica.clientes WHERE slug=chr(97)||chr(109)||chr(112)||chr(101)||chr(100)||chr(105)||chr(97))
                AND (table_name ILIKE chr(37)||chr(97)||chr(114)||chr(116)||chr(105)||chr(99)||chr(37)
                     OR table_name IN (chr(118)||chr(101)||chr(110)||chr(116)||chr(97)||chr(115),
                         chr(99)||chr(111)||chr(109)||chr(112)||chr(114)||chr(97)||chr(115),
                         chr(112)||chr(114)||chr(111)||chr(100)||chr(117)||chr(99)||chr(116)||chr(111)||chr(115),
                         chr(115)||chr(116)||chr(111)||chr(99)||chr(107),
                         chr(112)||chr(114)||chr(111)||chr(118)||chr(101)||chr(101)||chr(100)||chr(111)||chr(114)||chr(101)||chr(115)))
              GROUP BY table_name ORDER BY table_name;"
          '
