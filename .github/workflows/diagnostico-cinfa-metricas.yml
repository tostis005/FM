name: Diagnóstico puntual Cinfa CN y métricas
on:
  push:
    branches: ["fix/preparador-cinfa-catalogo-proveedores-carga-20261025"]
    paths: [".github/workflows/diagnostico-cinfa-metricas.yml"]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Conectar al VPS
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/fm_diag
          chmod 600 ~/.ssh/fm_diag
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Verificar cobertura por CN, artículos y ventas (solo conteos)
        run: |
          set -euo pipefail
          cat <<'SQL' | ssh -i ~/.ssh/fm_diag -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='25s';
          SELECT 'CINFA_NOMENCLATOR_CN',count(*) FROM farmetrica.nomenclator_presentaciones
           WHERE laboratorio_comercializador ILIKE '%cinfa%' OR laboratorio_titular ILIKE '%cinfa%';
          SELECT 'CINFA_MAPPED_SUPPLIERS',count(*)
           FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND laboratorio_clave='N:CINFA';
          SELECT 'ERP_CINFA_CN_MATCH',count(*),count(DISTINCT a.codigo_nacional)
           FROM ampedia.articulos a
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.codigo_nacional)=n.cn
           WHERE n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%';
          SELECT 'ERP_CINFA_STOCK_NONZERO',count(*)
           FROM ampedia.articulos a
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.codigo_nacional)=n.cn
           WHERE (n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%')
            AND coalesce(a.stock_actual,0)<>0;
          SELECT 'ERP_CINFA_RECENT_SALES_MATCH',count(*)
           FROM ampedia.fm_ventas_analitica v
           JOIN ampedia.articulos a ON v.articulo_id::text=a.origen_id::text
             AND upper(btrim(v.farmacia_codigo))=upper(btrim(a.farmacia_codigo))
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.codigo_nacional)=n.cn
           WHERE (n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%')
            AND v.fecha>=current_date-interval '365 days';
          SELECT 'SALES_ROWS_TOTAL_LAST_365',count(*) FROM ampedia.fm_ventas_analitica
           WHERE fecha>=current_date-interval '365 days';
          SELECT 'PRODUCTS_WITH_LAB_SOURCE',count(*) FROM farmetrica.articulos_laboratorio_maestro
           WHERE laboratorio_nombre ILIKE '%cinfa%';
          SELECT 'SUPPLIERS_WITH_NAME_CINFA',count(*) FROM farmetrica.proveedores_maestro
           WHERE cliente_slug='ampedia' AND nombre ILIKE '%cinfa%';
          SELECT 'ERP_ARTICLES_TOTAL',count(*),
            count(*) FILTER (WHERE nullif(btrim(codigo_nacional),'') IS NOT NULL),
            count(*) FILTER (WHERE char_length(btrim(codigo_nacional)) BETWEEN 6 AND 7),
            count(*) FILTER (WHERE char_length(btrim(codigo_nacional))=13)
           FROM ampedia.articulos;
          SELECT 'ERP_6DIGIT_TO_AEMPS',count(*)
           FROM ampedia.articulos a JOIN farmetrica.nomenclator_presentaciones n
            ON left(btrim(a.codigo_nacional),6)=left(n.cn,6)
           WHERE char_length(btrim(a.codigo_nacional)) BETWEEN 6 AND 7;
          SELECT 'CINFA_RECEIPTS_GLOBAL_SUPPLIER',count(DISTINCT r.articulo_id),count(*)
           FROM ampedia.fm_recepciones_analitica r
           JOIN farmetrica.proveedores_maestro pm
            ON pm.cliente_slug='ampedia' AND pm.laboratorio_clave='N:CINFA'
            AND (CASE WHEN translate(btrim(pm.codigo_origen),'0123456789','')=''
              THEN coalesce(nullif(ltrim(btrim(pm.codigo_origen),'0'),''),'0')
              ELSE upper(btrim(pm.codigo_origen)) END)
            =(CASE WHEN translate(btrim(r.proveedor_id),'0123456789','')=''
              THEN coalesce(nullif(ltrim(btrim(r.proveedor_id),'0'),''),'0')
              ELSE upper(btrim(r.proveedor_id)) END);
          SELECT 'CINFA_RECEIPTS_TO_ERP',count(DISTINCT a.codigo_nacional),count(*)
           FROM ampedia.fm_recepciones_analitica r
           JOIN farmetrica.proveedores_maestro pm
            ON pm.cliente_slug='ampedia' AND pm.laboratorio_clave='N:CINFA'
            AND (CASE WHEN translate(btrim(pm.codigo_origen),'0123456789','')=''
              THEN coalesce(nullif(ltrim(btrim(pm.codigo_origen),'0'),''),'0')
              ELSE upper(btrim(pm.codigo_origen)) END)
            =(CASE WHEN translate(btrim(r.proveedor_id),'0123456789','')=''
              THEN coalesce(nullif(ltrim(btrim(r.proveedor_id),'0'),''),'0')
              ELSE upper(btrim(r.proveedor_id)) END)
           JOIN ampedia.articulos a ON a.origen_id::text=r.articulo_id::text
            AND upper(btrim(a.farmacia_codigo))=upper(btrim(r.farmacia_codigo));
          SELECT 'CINFA_GLOBAL_MAPPINGS',string_agg(codigo_origen,',')
           FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND laboratorio_clave='N:CINFA';
          SELECT 'CINFA_SPECIFIC_MAPPINGS',count(*)
           FROM farmetrica.proveedores_laboratorios WHERE cliente_slug='ampedia' AND laboratorio_clave='N:CINFA';
          SELECT 'ERP_ID_TO_AEMPS_CN',count(*)
           FROM ampedia.articulos a JOIN farmetrica.nomenclator_presentaciones n
            ON btrim(a.origen_id::text)=n.cn;
          SELECT 'ERP_ID_LENGTHS',char_length(btrim(origen_id::text)),count(*)
           FROM ampedia.articulos GROUP BY 2 ORDER BY 3 DESC LIMIT 12;
          SELECT 'ARTICLE_SCHEMA_COLUMNS',string_agg(column_name,',')
           FROM information_schema.columns
           WHERE table_schema='ampedia' AND table_name='articulos';
          SELECT 'SALES_TO_ERP',count(*)
           FROM ampedia.fm_ventas_analitica v JOIN ampedia.articulos a
             ON v.articulo_id::text=a.origen_id::text
              AND upper(btrim(v.farmacia_codigo))=upper(btrim(a.farmacia_codigo))
           WHERE v.fecha>=current_date-interval '365 days';
          SELECT 'CN_NORMALIZADO_COVERAGE',count(*) FILTER (WHERE nullif(btrim(cn_normalizado),'') IS NOT NULL),
           count(*) FILTER (WHERE nullif(btrim(ean),'') IS NOT NULL),
           count(*) FILTER (WHERE nullif(btrim(proveedor_habitual_id),'') IS NOT NULL)
           FROM ampedia.articulos;
          SELECT 'CN_NORMALIZADO_AEMPS_MATCH',count(*) FROM ampedia.articulos a
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.cn_normalizado)=n.cn;
          SELECT 'CINFA_CN_NORMALIZADO_MATCH',count(*) FROM ampedia.articulos a
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.cn_normalizado)=n.cn
           WHERE n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%';
          SELECT 'CINFA_ORIGEN_ID_MATCH',count(*) FROM ampedia.articulos a
           JOIN farmetrica.nomenclator_presentaciones n ON btrim(a.origen_id::text)=n.cn
           WHERE n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%';
          SELECT 'CINFA_SUPPLIER_HABITUAL',count(*) FROM ampedia.articulos a
           JOIN farmetrica.proveedores_maestro pm ON pm.cliente_slug='ampedia'
            AND pm.laboratorio_clave='N:CINFA'
            AND ltrim(btrim(a.proveedor_habitual_id),'0')=ltrim(btrim(pm.codigo_origen),'0');
          COMMIT;
          SQL
