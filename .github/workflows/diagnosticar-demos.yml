name: Diagnosticar demos sin modificar datos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Autenticar SSH de producción
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Diagnosticar sólo metadatos y presencia de datos ERP
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout='12000ms';
          SELECT d.slug AS demo,d.esquema_datos AS esquema,
            d.demo_origen_slug AS origen,
            to_regclass(format('%I.fm_ventas_analitica',d.esquema_datos)) IS NOT NULL AS vista_ventas,
            to_regclass(format('%I.articulos',d.esquema_datos)) IS NOT NULL AS vista_articulos,
            to_regclass(format('%I.fm_recepciones_analitica',d.esquema_datos)) IS NOT NULL AS vista_compras
          FROM farmetrica.clientes d WHERE d.demo_origen_slug IS NOT NULL
          ORDER BY d.slug;
          SELECT d.slug AS demo,
            count(*) AS farmacias,
            count(*) FILTER (WHERE f.activo) AS activas,
            count(*) FILTER (WHERE f.activo AND origen.id IS NOT NULL) AS activas_con_codigo_erp_valido,
            count(*) FILTER (WHERE f.activo AND origen.id IS NULL) AS activas_sin_correspondencia_erp
          FROM farmetrica.clientes d JOIN farmetrica.farmacias f ON f.cliente_slug=d.slug
          LEFT JOIN farmetrica.farmacias origen
            ON origen.cliente_slug=d.demo_origen_slug
            AND upper(btrim(f.codigo_origen)) =
            (CASE WHEN origen.cliente_slug='ampedia' AND origen.id=5
              AND upper(btrim(origen.codigo_origen)) IN ('POL','VAL')
              THEN 'VAL' ELSE upper(btrim(origen.codigo_origen)) END)
          WHERE d.demo_origen_slug IS NOT NULL
          GROUP BY d.slug ORDER BY d.slug;
          DO $audit$
          DECLARE d record; exists_ventas bool; exists_articulos bool;
          BEGIN
            FOR d IN SELECT slug,esquema_datos FROM farmetrica.clientes
              WHERE demo_origen_slug IS NOT NULL ORDER BY slug LOOP
              exists_ventas:=false; exists_articulos:=false;
              IF to_regclass(format('%I.fm_ventas_analitica',d.esquema_datos)) IS NOT NULL THEN
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica LIMIT 1)',
                  d.esquema_datos) INTO exists_ventas;
              END IF;
              IF to_regclass(format('%I.articulos',d.esquema_datos)) IS NOT NULL THEN
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.articulos LIMIT 1)',
                  d.esquema_datos) INTO exists_articulos;
              END IF;
              RAISE NOTICE 'demo=% ventas_vista_con_datos=% articulos_con_datos=%',
                d.slug,exists_ventas,exists_articulos;
            END LOOP;
          END $audit$;
          SELECT d.slug AS demo, t.tabla, coalesce(c.relkind::text,'no_existe') AS clase,
            CASE WHEN c.relkind='v' THEN
              position('ampedia.' IN pg_get_viewdef(c.oid,true))>0
            ELSE NULL END AS vista_apunta_ampedia
          FROM farmetrica.clientes d
          CROSS JOIN (VALUES ('ventas'),('articulos'),
            ('fm_ventas_cabeceras'),('fm_ventas_lineas'),('fm_ventas_analitica'),
            ('fm_recepciones_cabeceras'),('fm_recepciones_lineas'),('fm_recepciones_analitica')
          ) AS t(tabla)
          LEFT JOIN pg_namespace n ON n.nspname=d.esquema_datos
          LEFT JOIN pg_class c ON c.relnamespace=n.oid AND c.relname=t.tabla
          WHERE d.demo_origen_slug IS NOT NULL
          ORDER BY d.slug,t.tabla;
          SELECT cliente_slug AS cliente, count(*) AS filas_cache_mes
          FROM farmetrica.dashboard_consolidados_mensuales
          WHERE cliente_slug IN('ampedia','demo_farmetrica','demo_individual')
          GROUP BY cliente_slug ORDER BY cliente_slug;
          DO $check$
          DECLARE d record; k record; has_by_active bool; fresh_by_active bool;
          BEGIN
            FOR d IN SELECT c.slug,c.esquema_datos FROM farmetrica.clientes c
              WHERE c.demo_origen_slug IS NOT NULL ORDER BY c.slug LOOP
              FOR k IN SELECT CASE WHEN f.codigo_origen='POL' THEN 'VAL' ELSE f.codigo_origen END AS code
                  FROM farmetrica.farmacias f
                  WHERE f.cliente_slug=d.slug AND f.activo LOOP
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica WHERE farmacia_codigo=$1 LIMIT 1)',
                   d.esquema_datos) INTO has_by_active USING k.code;
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica WHERE farmacia_codigo=$1 AND fecha >= CURRENT_DATE - INTERVAL ''60 days'' LIMIT 1)',
                   d.esquema_datos) INTO fresh_by_active USING k.code;
                RAISE NOTICE 'demo=% farmacia_activa_ventas=% ventas_ultimos_60_dias=%',
                  d.slug,has_by_active,fresh_by_active;
              END LOOP;
            END LOOP;
          END $check$;
          DO $audit_tables$
          DECLARE x record; nonempty bool;
          BEGIN
            FOR x IN
              SELECT d.slug, d.esquema_datos, cls.relname
              FROM farmetrica.clientes d
              JOIN pg_namespace ns ON ns.nspname=d.esquema_datos
              JOIN pg_class cls ON cls.relnamespace=ns.oid
              WHERE d.demo_origen_slug IS NOT NULL
               AND cls.relkind IN ('r','p')
               AND cls.relname IN('fm_ventas_cabeceras','fm_ventas_lineas',
                 'fm_recepciones_cabeceras','fm_recepciones_lineas',
                 'fm_pedidos_cabeceras','fm_pedidos_lineas',
                 'fm_stock_fotografia','fm_producto_correspondencias')
              ORDER BY d.slug,cls.relname
            LOOP
              EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.%I LIMIT 1)',
                x.esquema_datos,x.relname) INTO nonempty;
              RAISE NOTICE 'demo=% tabla_local=% tiene_registros=%',
                x.slug,x.relname,nonempty;
            END LOOP;
          END $audit_tables$;
          SELECT d.slug,
            (SELECT count(*) FROM farmetrica.proveedores_unificados u WHERE u.cliente_slug=d.slug) AS proveedores_unificados,
            (SELECT count(*) FROM farmetrica.proveedores_unificados_alias a WHERE a.cliente_slug=d.slug) AS alias_proveedores,
            (SELECT count(*) FROM farmetrica.proveedores_maestro p WHERE p.cliente_slug=d.slug) AS proveedores_maestro,
            (SELECT count(*) FROM farmetrica.preparador_ultima_recepcion_cache c WHERE c.cliente_slug=d.slug) AS cn_ultima_recepcion,
            (SELECT count(*) FROM farmetrica.preparador_ultima_recepcion_estado s WHERE s.cliente_slug=d.slug) AS snapshot_registrado,
            (SELECT count(*) FROM farmetrica.preparador_frecuencia_laboratorio p WHERE p.cliente_slug=d.slug) AS frecuencia_laboratorios,
            (SELECT count(*) FROM farmetrica.preparador_pedidos_globales p WHERE p.cliente_slug=d.slug) AS pedidos_preparador,
            (SELECT count(*) FROM farmetrica.familias_globales g WHERE g.cliente_slug=d.slug) AS familias,
            (SELECT count(*) FROM farmetrica.familias_globales_articulos a WHERE a.cliente_slug=d.slug) AS articulos_familias,
            (SELECT count(*) FROM farmetrica.transferidor_configuracion_cliente p WHERE p.cliente_slug=d.slug) AS politica_transferidor,
            (SELECT count(*) FROM farmetrica.picking_list_fuentes p WHERE p.cliente_slug=d.slug) AS picking_fuentes,
            (SELECT count(*) FROM farmetrica.dashboard_consolidados_diarios p WHERE p.cliente_slug=d.slug) AS dashboard_dias,
            (SELECT count(*) FROM farmetrica.dashboard_consolidados_anuales p WHERE p.cliente_slug=d.slug) AS dashboard_anios,
            (SELECT count(*) FROM farmetrica.ventas_panorama_meses_cerrados p WHERE p.cliente_slug=d.slug) AS panorama_meses
          FROM farmetrica.clientes d WHERE d.slug IN
            ('ampedia','demo_farmetrica','demo_individual') ORDER BY d.slug;
          SELECT d.slug, m.modulo_clave, m.habilitado
          FROM farmetrica.cliente_modulos m
          JOIN farmetrica.clientes d ON d.slug=m.cliente_slug
          WHERE d.slug IN ('demo_farmetrica','demo_individual')
           AND m.modulo_clave IN ('dashboard','compras','stock','reposicion','ventas','genericos','rentabilidad')
          ORDER BY d.slug,m.modulo_clave;
          SELECT c.slug,
            (SELECT COUNT(*) FROM farmetrica.usuario_clientes u WHERE u.cliente_slug=c.slug) AS memberships
          FROM farmetrica.clientes c WHERE c.slug IN('ampedia','demo_farmetrica','demo_individual');
          COMMIT;
          SQL

      - name: Comprobar la matriz real del preparador de Demo Individual
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T api node --input-type=module' <<'JS'
          import pg from "pg";
          import {readLaboratoryOrderMatrix} from "./src/laboratoryOrderPlanner.js";
          import {pharmacyDataCodeSQL} from "./src/pharmacyCodes.js";
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1,
            connectionTimeoutMillis:5000,statement_timeout:35000,query_timeout:38000});
          const db=await pool.connect();
          try{
           await db.query("BEGIN READ ONLY");
           await db.query("SET LOCAL statement_timeout='30s'");
           for(const slug of ["demo_individual","demo_farmetrica"]){
            const {rows:ph}=await db.query({
             text:"SELECT id::int,codigo_origen FROM farmetrica.farmacias "+
              "WHERE cliente_slug=$1 AND activo AND tipo_establecimiento='farmacia' ORDER BY id LIMIT 1",
             values:[slug],query_timeout:3000});
            if(!ph.length)throw Error(slug+": no active pharmacy");
            const code=ph[0].codigo_origen==="POL"?"VAL":ph[0].codigo_origen;
            const {rows:sample}=await db.query({text:
             'SELECT codigo_nacional AS cn FROM "'+slug+'".articulos WHERE farmacia_codigo=$1 '+
             "AND codigo_nacional ~ '^[0-9]{6,7}",
             values:[code],query_timeout:8000});
            if(!sample.length)throw Error(slug+": no article with valid 6/7 digit CN");
            const {rows:overview}=await db.query({text:
              'SELECT count(*)::int AS products,count(*) FILTER(WHERE stock_actual>0)::int AS positive '+
              'FROM "'+slug+'".articulos WHERE upper(btrim(farmacia_codigo))=upper(btrim($1))',
              values:[code],query_timeout:16000});
            console.info("DEMO_ARTICLE_STATS",JSON.stringify({slug,hasProducts:overview[0].products>0,
              hasPositiveStock:overview[0].positive>0}));
            const cn=String(sample[0].cn),type=Number(cn.slice(0,6))>=400000?"medicacion":"parafarmacia";
            const ctx={client:{slug,schema:slug,demo:true},pharmacies:[{id:String(ph[0].id)}]};
            const start=Date.now();
            const matrix=await readLaboratoryOrderMatrix(db,ctx,{
             key:"P:1",pharmacies:[ph[0].id],type,from:"2026-09-01",to:"2026-11-14",
             prefetchedRows:[{referencia:cn,cn,nombre:"Diagnóstico"}]});
            const m=matrix.rows[0]?.byPharmacy?.[String(ph[0].id)];
            console.info("DEMO_MATRIX",JSON.stringify({slug,type,rows:matrix.rows.length,
             metricsUnavailable:matrix.metricsUnavailable,errorCode:matrix.metricsErrorCode||null,
             hasMetrics:Boolean(m),stockDefined:m?.stock!==undefined,
             unitsDefined:m?.unitsPeriod!==undefined,durationMs:Date.now()-start}));
           }
           await db.query("ROLLBACK");
          }catch(e){await db.query("ROLLBACK").catch(()=>{});console.error("DEMO_MATRIX_ERROR",e.code||e.name,e.message);process.exitCode=1}
          finally{db.release();await pool.end()}
          JS
