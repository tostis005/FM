name: Auditar tablas e índices PostgreSQL (solo lectura)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auditar-postgresql.yml"
      - "ops/auditoria-esquema-postgresql.sql"
      - "ops/diagnostico-compras-ventas.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar acceso existente al VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Inventario de catálogos PostgreSQL (transacción READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' \
            < ops/auditoria-esquema-postgresql.sql | tee "$RUNNER_TEMP/farmetrica-audit.txt"
          test -s "$RUNNER_TEMP/farmetrica-audit.txt"
          grep -q '^INDEX|' "$RUNNER_TEMP/farmetrica-audit.txt"
          grep -q '^TABLE|' "$RUNNER_TEMP/farmetrica-audit.txt"
      - name: Comparar cobertura e importes de documentos (solo agregados)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' \
            < ops/diagnostico-compras-ventas.sql | tee "$RUNNER_TEMP/comparativa-compras-ventas.txt"
          grep -q '^COMPARE|' "$RUNNER_TEMP/comparativa-compras-ventas.txt"
          grep -q '^DOCUMENT_STATUS|' "$RUNNER_TEMP/comparativa-compras-ventas.txt"
      - name: Adjuntar comparativa de importes agregados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparativa-compras-ventas-2026
          path: ${{ runner.temp }}/comparativa-compras-ventas.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Adjuntar inventario sin datos comerciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-postgresql-farmetrica
          path: ${{ runner.temp }}/farmetrica-audit.txt
          if-no-files-found: ignore
          retention-days: 7
