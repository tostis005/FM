name: Diagnosticar demos sin modificar datos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Autenticar SSH de producción
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Diagnosticar sólo metadatos y presencia de datos ERP
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout='12000ms';
          SELECT d.slug AS demo,d.esquema_datos AS esquema,
            d.demo_origen_slug AS origen,
            to_regclass(format('%I.fm_ventas_analitica',d.esquema_datos)) IS NOT NULL AS vista_ventas,
            to_regclass(format('%I.articulos',d.esquema_datos)) IS NOT NULL AS vista_articulos,
            to_regclass(format('%I.fm_recepciones_analitica',d.esquema_datos)) IS NOT NULL AS vista_compras
          FROM farmetrica.clientes d WHERE d.demo_origen_slug IS NOT NULL
          ORDER BY d.slug;
          SELECT d.slug AS demo,
            count(*) AS farmacias,
            count(*) FILTER (WHERE f.activo) AS activas,
            count(*) FILTER (WHERE f.activo AND origen.id IS NOT NULL) AS activas_con_codigo_erp_valido,
            count(*) FILTER (WHERE f.activo AND origen.id IS NULL) AS activas_sin_correspondencia_erp
          FROM farmetrica.clientes d JOIN farmetrica.farmacias f ON f.cliente_slug=d.slug
          LEFT JOIN farmetrica.farmacias origen
            ON origen.cliente_slug=d.demo_origen_slug
            AND upper(btrim(f.codigo_origen)) =
            (CASE WHEN origen.cliente_slug='ampedia' AND origen.id=5
              AND upper(btrim(origen.codigo_origen)) IN ('POL','VAL')
              THEN 'VAL' ELSE upper(btrim(origen.codigo_origen)) END)
          WHERE d.demo_origen_slug IS NOT NULL
          GROUP BY d.slug ORDER BY d.slug;
          DO $audit$
          DECLARE d record; exists_ventas bool; exists_articulos bool;
          BEGIN
            FOR d IN SELECT slug,esquema_datos FROM farmetrica.clientes
              WHERE demo_origen_slug IS NOT NULL ORDER BY slug LOOP
              exists_ventas:=false; exists_articulos:=false;
              IF to_regclass(format('%I.fm_ventas_analitica',d.esquema_datos)) IS NOT NULL THEN
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica LIMIT 1)',
                  d.esquema_datos) INTO exists_ventas;
              END IF;
              IF to_regclass(format('%I.articulos',d.esquema_datos)) IS NOT NULL THEN
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.articulos LIMIT 1)',
                  d.esquema_datos) INTO exists_articulos;
              END IF;
              RAISE NOTICE 'demo=% ventas_vista_con_datos=% articulos_con_datos=%',
                d.slug,exists_ventas,exists_articulos;
            END LOOP;
          END $audit$;
          SELECT d.slug AS demo, t.tabla, coalesce(c.relkind::text,'no_existe') AS clase,
            CASE WHEN c.relkind='v' THEN
              position('ampedia.' IN pg_get_viewdef(c.oid,true))>0
            ELSE NULL END AS vista_apunta_ampedia
          FROM farmetrica.clientes d
          CROSS JOIN (VALUES ('ventas'),('articulos'),
            ('fm_ventas_cabeceras'),('fm_ventas_lineas'),('fm_ventas_analitica'),
            ('fm_recepciones_cabeceras'),('fm_recepciones_lineas'),('fm_recepciones_analitica')
          ) AS t(tabla)
          LEFT JOIN pg_namespace n ON n.nspname=d.esquema_datos
          LEFT JOIN pg_class c ON c.relnamespace=n.oid AND c.relname=t.tabla
          WHERE d.demo_origen_slug IS NOT NULL
          ORDER BY d.slug,t.tabla;
          SELECT cliente_slug AS cliente, count(*) AS filas_cache_mes
          FROM farmetrica.dashboard_consolidados_mensuales
          WHERE cliente_slug IN('ampedia','demo_farmetrica','demo_individual')
          GROUP BY cliente_slug ORDER BY cliente_slug;
          DO $check$
          DECLARE d record; k record; has_by_active bool; fresh_by_active bool;
          BEGIN
            FOR d IN SELECT c.slug,c.esquema_datos FROM farmetrica.clientes c
              WHERE c.demo_origen_slug IS NOT NULL ORDER BY c.slug LOOP
              FOR k IN SELECT CASE WHEN f.codigo_origen='POL' THEN 'VAL' ELSE f.codigo_origen END AS code
                  FROM farmetrica.farmacias f
                  WHERE f.cliente_slug=d.slug AND f.activo LOOP
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica WHERE farmacia_codigo=$1 LIMIT 1)',
                   d.esquema_datos) INTO has_by_active USING k.code;
                EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.fm_ventas_analitica WHERE farmacia_codigo=$1 AND fecha >= CURRENT_DATE - INTERVAL ''60 days'' LIMIT 1)',
                   d.esquema_datos) INTO fresh_by_active USING k.code;
                RAISE NOTICE 'demo=% farmacia_activa_ventas=% ventas_ultimos_60_dias=%',
                  d.slug,has_by_active,fresh_by_active;
              END LOOP;
            END LOOP;
          END $check$;
          DO $audit_tables$
          DECLARE x record; nonempty bool;
          BEGIN
            FOR x IN
              SELECT d.slug, d.esquema_datos, cls.relname
              FROM farmetrica.clientes d
              JOIN pg_namespace ns ON ns.nspname=d.esquema_datos
              JOIN pg_class cls ON cls.relnamespace=ns.oid
              WHERE d.demo_origen_slug IS NOT NULL
               AND cls.relkind IN ('r','p')
               AND cls.relname IN('fm_ventas_cabeceras','fm_ventas_lineas',
                 'fm_recepciones_cabeceras','fm_recepciones_lineas',
                 'fm_pedidos_cabeceras','fm_pedidos_lineas',
                 'fm_stock_fotografia','fm_producto_correspondencias')
              ORDER BY d.slug,cls.relname
            LOOP
              EXECUTE format('SELECT EXISTS(SELECT 1 FROM %I.%I LIMIT 1)',
                x.esquema_datos,x.relname) INTO nonempty;
              RAISE NOTICE 'demo=% tabla_local=% tiene_registros=%',
                x.slug,x.relname,nonempty;
            END LOOP;
          END $audit_tables$;
          COMMIT;
          SQL
