name: Diagnóstico puntual de columnas de Stock sin recepciones
on:
  push:
    branches: [diagnostic/stock-columns-20261028]
    paths: [".github/workflows/diagnose-stock-sin-recepciones.yml"]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar acceso seguro
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Comprobar exclusivamente metadatos de columnas, sin datos de farmacia
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '8s';
          WITH expected(rel,col) AS (
           VALUES
           ('articulos','farmacia_codigo'),('articulos','origen_id'),
           ('articulos','codigo_nacional'),('articulos','nombre'),
           ('articulos','laboratorio'),('articulos','stock_actual'),
           ('articulos','sincronizado_en'),
           ('fm_recepciones_lineas','farmacia_codigo'),
           ('fm_recepciones_lineas','sistema_origen'),
           ('fm_recepciones_lineas','documento_id'),
           ('fm_recepciones_lineas','articulo_origen_id'),
           ('fm_recepciones_lineas','eliminada_logicamente'),
           ('fm_recepciones_lineas','cantidad'),
           ('fm_recepciones_lineas','devuelta'),
           ('fm_recepciones_cabeceras','farmacia_codigo'),
           ('fm_recepciones_cabeceras','sistema_origen'),
           ('fm_recepciones_cabeceras','documento_id'),
           ('fm_recepciones_cabeceras','fecha'),
           ('fm_recepciones_cabeceras','proveedor_origen_id'),
           ('fm_recepciones_cabeceras','lineas_completas'),
           ('fm_recepciones_cabeceras','eliminado_logicamente'),
           ('fm_recepciones_cabeceras','estado'),
           ('fm_ventas_lineas','farmacia_codigo'),
           ('fm_ventas_lineas','sistema_origen'),
           ('fm_ventas_lineas','documento_id'),
           ('fm_ventas_lineas','articulo_origen_id'),
           ('fm_ventas_lineas','eliminada_logicamente'),
           ('fm_ventas_lineas','anulada'),
           ('fm_ventas_lineas','cantidad'),
           ('fm_ventas_lineas','devuelta'),
           ('fm_ventas_cabeceras','farmacia_codigo'),
           ('fm_ventas_cabeceras','sistema_origen'),
           ('fm_ventas_cabeceras','documento_id'),
           ('fm_ventas_cabeceras','fecha'),
           ('fm_ventas_cabeceras','lineas_completas'),
           ('fm_ventas_cabeceras','eliminado_logicamente'),
           ('fm_ventas_cabeceras','estado')
          ), client AS (
            SELECT esquema_datos AS schema FROM farmetrica.clientes WHERE slug='ampedia'
          ), checks AS (
            SELECT e.rel,e.col,(a.attname IS NOT NULL) AS physical,
             EXISTS(
              SELECT 1 FROM information_schema.columns ic
              WHERE ic.table_schema=client.schema AND ic.table_name=e.rel
               AND ic.column_name=e.col
             ) AS visible
            FROM expected e CROSS JOIN client
            LEFT JOIN pg_namespace n ON n.nspname=client.schema
            LEFT JOIN pg_class c ON c.relnamespace=n.oid AND c.relname=e.rel
            LEFT JOIN pg_attribute a ON a.attrelid=c.oid AND a.attname=e.col
             AND a.attnum>0 AND NOT a.attisdropped
          )
          SELECT 'COLUMN_MISMATCH|' || rel || '.' || col ||
                 '|physical=' || physical || '|visible=' || visible
          FROM checks WHERE NOT physical OR NOT visible
          ORDER BY rel,col;
          SELECT 'STOCK_META|diagnostic_complete';
          COMMIT;
          SQL
