name: Verificar MCP demo pública sin autenticación
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar respuestas sintéticas sin token y MCP privado protegido
        shell: bash
        run: |
          set -euo pipefail
          demo=https://farmetrica.com/api/mcp-demo
          private=https://farmetrica.com/api/mcp
          for method in initialize tools/list; do
            status=$(curl -sS --max-time 15 -o "/tmp/demo-$method.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\"}" "$demo")
            test "$status" = 200 || { echo "MCP demo $method: HTTP $status"; exit 1; }
          done
          status=$(curl -sS --max-time 15 -o /tmp/demo-contexto.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"listar_contexto","arguments":{}}}' "$demo")
          test "$status" = 200 || { echo "MCP demo contexto: HTTP $status"; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/demo-contexto.json'))['result']['structuredContent']
          assert data['ficticio'] is True
          assert len(data['farmacias'])==3
          assert all(p['id']>=90001 for p in data['farmacias'])
          assert 'SINTÉTICOS' in data['aviso']
          tools=json.load(open('/tmp/demo-tools/list.json'))['result']['tools']
          assert len(tools)==4
          assert all(t['annotations']['readOnlyHint'] is True for t in tools)
          PY
          main_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$private")
          test "$main_status" = 401 || { echo "MCP privado no protegido: HTTP $main_status"; exit 1; }
          echo "MCP demo público con datos ficticios; MCP principal con OAuth"
