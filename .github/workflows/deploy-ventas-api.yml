name: Desplegar API PostgreSQL independiente de Google

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-ventas-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmawao-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar codigo API
        run: |
          node --check api/src/server.js
          node --check api/src/accesos.js
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Comprobar condiciones antes de tocar el backend
        id: verificar
        shell: bash
        run: |
          set -euo pipefail
          ready=$(ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            if ! cd /opt/farmawao; then echo SIN_DIRECTORIO_FARMAWAO; exit 0; fi
            if ! test -f compose.yaml; then echo SIN_COMPOSE; exit 0; fi
            if ! test -f .env; then echo SIN_ENV; exit 0; fi
            if ! test -d api; then echo SIN_DIRECTORIO_API; exit 0; fi
            # Google no interviene en la conexión de la API al servicio local db.
            # Solo desplegar si la API tiene configurada su conexión privada a PostgreSQL.
            if ! docker compose config --quiet; then echo COMPOSE_INVALIDO; exit 0; fi
            if ! docker compose config | grep -qE "^[[:space:]]+DATABASE_URL: [^[:space:]]"; then
              echo PENDIENTE_DATABASE_URL_API; exit 0
            fi
            if ! docker compose exec -T db psql -X -At -U farmawao -d farmawao -c "
              SELECT count(*) = 5 FROM information_schema.columns
              WHERE table_schema IN ('\''farmatic'\'','\''ampedia'\'') AND table_name = '\''lineaventa'\''
                AND column_name IN ('\''farmacia_origen'\'','\''codigo'\'','\''descripcion'\'','\''fechahora'\'','\''cantidad'\'');
            " | grep -qx t; then echo TABLA_FARMATIC_NO_LISTA; exit 0; fi
            if ! docker compose config --quiet; then echo COMPOSE_INVALIDO; exit 0; fi
            if ! test -w api || ! test -d api_backups || ! test -w api_backups || ! test -f compose.farmacias.yml || ! test -w compose.farmacias.yml; then echo SIN_PERMISOS_API; exit 0; fi
            echo LISTO
          ')
          if [[ "$ready" == LISTO ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API sin desplegar; comprobación segura: $ready"
          fi
      - name: Copiar API y override (no modificar PostgreSQL)
        if: steps.verificar.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tar -czf - -C api . | ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            backup="/opt/farmawao/api_backups/api.$(date +%Y%m%d%H%M%S)"
            cp -a api "$backup"
            tar -xzf - -C api
          '
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.farmacias.yml "$VPS_USER@$VPS_HOST:/opt/farmawao/compose.farmacias.yml"
      - name: Comprobar compose y desplegar solo API (sin tocar web ni base de datos)
        if: steps.verificar.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            docker compose -f compose.yaml -f compose.farmacias.yml config --quiet
            docker compose -f compose.yaml -f compose.farmacias.yml up -d --build --no-deps api
            for i in $(seq 1 25); do
              if docker compose -f compose.yaml -f compose.farmacias.yml exec -T api node -e "fetch(\"http://127.0.0.1:8000/api/health/database\").then(r => r.json()).then(j => process.exit(j.database === \"connected\" ? 0 : 1)).catch(() => process.exit(1))"; then exit 0; fi
              sleep 3
            done
            echo "API no confirma conexión local a PostgreSQL"
            exit 1
          '
