name: Validar frontend y API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["api/**", "web/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar API
        run: |
          node --check api/src/server.js
          node --check api/src/assistant.js
          node --check api/src/assistantAnalytics.js
          node --test api/src/assistant.test.js
          node --check api/src/accesos.js
          node --check api/src/tenant.js
          node --test api/src/supplierReporting.test.js
          node --test api/src/purchasePlanner.test.js
          node --test api/src/outgoingTransfersRules.test.js
          node --test api/src/commercialNames.test.js
          node --check api/src/syncStatus.js
          node --check api/src/promocionesTenant.js
          node --test api/src/promocionesTenant.test.js
          node --test api/src/promocionesReplace.test.js
          node --test api/src/promotionImportIdentity.test.js
          node --check api/src/genericos.js
          node --check api/src/genericosReales.js
          node --check api/src/demoClients.js
          node --check api/src/internalPassword.js
          node --check api/src/genericosReales.js
          node --check api/src/realReports.js
          node --check api/src/salesSummary.js
          node --check api/src/salesTotals.js
          node --check api/src/salesInsights.js
          node --check api/src/salesDetail.js
          node --check api/src/salesCache.js
          node --test api/src/salesCache.test.js
          node --check api/src/salesAnalysisPeriod.js
          node --test api/src/salesAnalysisPeriod.test.js
          node --test api/src/tenantAnalysisPolicy.test.js
          node --test api/src/internalPassword.test.js
          node --test api/src/accessPolicy.test.js
          node --test api/src/operativaRules.test.js
          node --test api/src/pharmacyCodes.test.js
          node --check api/src/pricePolicy.js
          node --test api/src/pricePolicy.test.js
          node --test api/src/abcd.test.js
          node --test api/src/realReports.test.js
          node --test api/src/reportTableFilters.test.js
          node --test api/src/salesSummary.test.js
          node --test api/src/salesTotals.test.js
          node --test api/src/salesInsights.test.js
          node --test api/src/salesDetail.test.js
          node --test api/src/articleNames.test.js
          node --test api/src/genericos.test.js
          python3 -m unittest discover -s deploy/nomenclator -p 'test_*.py'
          python3 -m py_compile deploy/bootstrap-temp-admin-vps.py
          python3 -m py_compile api/src/setup_temp_login.py
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validar formato de CNs
        run: node --test web/src/cns.test.js
      - name: Compilar React
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node --test src/importarPromociones.test.js
          node --test src/objetivosImportacion.test.js
          node --test src/listLogic.test.js
          node --test src/reportFilterScopes.test.js
          node --test src/sharedReportFilters.test.js
          node --test src/businessAnalytics.test.js
          node --test src/salesPeriods.test.js
          node --test src/loadingProgress.test.js src/historicalSummaries.test.js
          node --test src/asyncBatches.test.js
          node --test src/localeES.test.js
          node --test src/promotionMetrics.test.js
          node --test src/laboratoryExport.test.js
          node --test src/dictadoVoz.test.js
          node check-login.mjs
          node generate-seo.mjs
          node check-marketing.mjs
          node check-theme.mjs
          npm run build

  validar_postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testfm
          POSTGRES_PASSWORD: testfm
          POSTGRES_DB: farmawao
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testfm -d farmawao"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar migraciones SQL y cambio de esquema sin datos perdidos
        shell: bash
        run: |
          set -euo pipefail
          psql_test() {
            docker run --rm -i --network host -e PGPASSWORD=testfm postgres:16-alpine \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U testfm -d farmawao "$@"
          }
          psql_test -c "CREATE SCHEMA farmatic;
            CREATE TABLE farmatic.lineaventa (
              farmacia_origen text, codigo text, descripcion text,
              fechahora timestamp, cantidad numeric
            );
            INSERT INTO farmatic.lineaventa VALUES ('ABA','123456','Test',now(),3);"
          for sql in api/src/migrations/001_farmacias.sql api/src/migrations/002_accesos.sql api/src/migrations/003_multitenant.sql; do
            psql_test --single-transaction < "$sql"
          done
          psql_test --single-transaction < api/src/migrations/005_proveedores.sql
          psql_test --single-transaction < api/src/migrations/017_proveedores_visibilidad.sql
          psql_test --single-transaction < api/src/migrations/017_proveedores_visibilidad.sql
          psql_test < api/src/migrations/004_ampedia_cutover_MANUAL.sql
          psql_test --single-transaction < api/src/migrations/003_multitenant.sql
          psql_test --single-transaction < api/src/migrations/009_promociones_cliente.sql
          psql_test --single-transaction < api/src/migrations/010_nomenclator_aemps.sql
          psql_test --single-transaction < api/src/migrations/011_configuracion_precios.sql
          psql_test --single-transaction < api/src/migrations/012_analisis_ventas_cliente.sql
          psql_test --single-transaction < api/src/migrations/013_accesos_locales.sql
          psql_test --single-transaction < api/src/migrations/020_dominios_cliente_reset.sql
          psql_test --single-transaction < api/src/migrations/020_dominios_cliente_reset.sql
          psql_test --single-transaction < api/src/migrations/014_clientes_demo.sql
          psql_test --single-transaction < api/src/migrations/015_cache_analitica_ventas.sql
          psql_test --single-transaction < api/src/migrations/016_modelo_documental.sql
          psql_test --single-transaction < api/src/migrations/018_lectura_documental.sql
          psql_test --single-transaction < api/src/migrations/021_traspasos_salientes.sql
          psql_test --single-transaction < api/src/migrations/018_lectura_documental.sql
          psql_test --single-transaction < api/src/migrations/021_traspasos_salientes.sql
          psql_test --single-transaction < api/src/migrations/016_operativa_manual.sql
          psql_test --single-transaction < api/src/migrations/016_operativa_manual.sql
          psql_test --single-transaction < api/src/migrations/011_configuracion_precios.sql
          psql_test --single-transaction < api/src/migrations/010_nomenclator_aemps.sql
          test "$(psql_test -At -c "SELECT CASE WHEN to_regclass('farmetrica.nomenclator_presentaciones') IS NOT NULL AND EXISTS(SELECT 1 FROM farmetrica.cliente_modulos WHERE cliente_slug='ampedia' AND modulo_clave='genericos' AND habilitado) THEN 1 ELSE 0 END;")" = 1
          psql_test -At -c "INSERT INTO ampedia.fm_promociones(id,documento,fuente) VALUES
            ('PRUEBA_SYNC',jsonb_build_object('id','PRUEBA_SYNC','name','Campaña test'),'CI');
            CREATE TABLE ampedia.ventas (
              farmacia_codigo text NOT NULL,origen_id text NOT NULL,
              fecha timestamp NOT NULL,articulo_id text,unidades numeric,
              importe numeric,precio_unitario numeric,numero_ticket text,
              descuento_linea numeric,descuento_operacion numeric,
              sincronizado_en timestamptz NOT NULL DEFAULT now(),
              PRIMARY KEY(farmacia_codigo,origen_id)
            );
            INSERT INTO ampedia.ventas(farmacia_codigo,origen_id,fecha,articulo_id,unidades,importe)
            VALUES ('ABA','1',now(),'ART-01',2,10);" >/dev/null
          psql_test --single-transaction < api/src/migrations/009_promociones_cliente.sql
          test "$(psql_test -At -c "SELECT count(*) FROM ampedia.fm_promociones WHERE id='PRUEBA_SYNC'")" = 1
          test "$(psql_test -At -c "SELECT count(*) FROM ampedia.ventas WHERE farmacia_codigo='ABA' AND articulo_id='ART-01'")" = 1
          result=$(psql_test -At -c "SELECT
            (SELECT count(*) FROM ampedia.lineaventa) = 1
            AND (SELECT count(*) FROM farmatic.lineaventa) = 1
            AND (SELECT esquema_datos FROM farmetrica.clientes WHERE slug='ampedia') = 'ampedia'
            AND (SELECT count(*) FROM farmetrica.superadministradores WHERE email='jose.fraga@gmail.com') = 1
            AND (SELECT count(*) FROM farmetrica.cliente_modulos WHERE cliente_slug='ampedia' AND habilitado) = 2
            AND (SELECT count(*) FROM farmetrica.farmacias WHERE cliente_slug='ampedia') = 5;")
          test "$result" = t
          psql_test -At -c "INSERT INTO farmetrica.proveedores_maestro(cliente_slug,codigo_origen,nombre,tipo) VALUES ('ampedia','COOP01','Cooperativa de prueba CI','cooperativa');" >/dev/null
          psql_test -At -c "SELECT count(*) FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND tipo='cooperativa';" | grep -qx 1
          psql_test -At -c "UPDATE farmetrica.proveedores_maestro SET cooperativa=false,ignorar_informes=true WHERE cliente_slug='ampedia' AND codigo_origen='COOP01';" >/dev/null
          psql_test --single-transaction < api/src/migrations/017_proveedores_visibilidad.sql
          test "$(psql_test -At -c "SELECT cooperativa=false AND ignorar_informes=true FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND codigo_origen='COOP01'")" = t
          psql_test --single-transaction < api/src/migrations/test_operational_reports_fixture.sql
          # CONCURRENTLY debe ejecutarse fuera de transacción; probar dos veces
          # para detectar índices duplicados, inválidos o migraciones no idempotentes.
          psql_test < ops/indices-documentales-concurrentes.sql
          psql_test < ops/indices-documentales-concurrentes.sql
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class idx
            JOIN pg_namespace ns ON ns.oid=idx.relnamespace
            JOIN pg_index ix ON ix.indexrelid=idx.oid
            WHERE ns.nspname='ampedia'
              AND idx.relname IN ('fm_doc_ventas_codigo_fecha_idx','fm_doc_recepciones_codigo_fecha_idx')
              AND ix.indisvalid AND ix.indisready;")" = 2
          psql_test < ops/indices-consultas-operativas.sql
          psql_test < ops/indices-consultas-operativas.sql
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class i JOIN pg_namespace n ON n.oid=i.relnamespace JOIN pg_index x ON x.indexrelid=i.oid WHERE n.nspname='ampedia' AND i.relname=ANY(ARRAY['fm_ventas_codigo_fecha_idx','fm_articulos_codigo_id_sync_idx','fm_compras_codigo_fecha_idx','fm_proveedores_codigo_id_sync_idx','fm_ventas_codigo_articulo_fecha_idx','fm_compras_codigo_articulo_fecha_idx']) AND x.indisvalid;")" = 6
          npm install --prefix api --no-audit --no-fund
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/documentalViews.integration.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/integrationLiveReports.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/integrationAuthLocal.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/integrationPasswordReset.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/integrationTenantDomains.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/integrationOperativa.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/supplierReporting.integration.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/outgoingTransfers.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/commercialNames.integration.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/documentScreens.integration.test.js
          TEST_DB_URL=postgres://testfm:testfm@127.0.0.1:5432/farmawao node --test api/src/purchasePlanner.integration.test.js


  validar_responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de prueba y dependencias web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Comprobar móviles, tablets, escritorio y tablas
        working-directory: web
        run: |
          set -euo pipefail
          node generate-seo.mjs
          npm run dev -- --port 4175 --strictPort > /tmp/farmetrica-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4175/promociones >/dev/null; then break; fi
            sleep 1
          done
          node check-responsive.mjs
          node check-dashboard-audit.mjs
          node check-purchase-planner.mjs
          node check-sales-loading.mjs
          node check-recepciones.mjs
          node check-recepciones-completas.mjs
          node check-refresh-navigation.mjs
          node check-navigation-arrows.mjs
          node check-genericos.mjs
          node check-promotions-delete.mjs
          node check-promotions-persistence.mjs
          node check-promotions-scope.mjs
          node check-traspasos-salientes.mjs
          node check-promotions-import.mjs
          node check-operativa.mjs
          node check-pantallas-reales.mjs
          python3 -m http.server 4176 --bind 127.0.0.1 --directory public > /tmp/farmetrica-public.log 2>&1 &
          for i in $(seq 1 25); do if curl --silent --fail http://127.0.0.1:4176/landing.html >/dev/null; then break; fi; sleep 1; done
          node check-public-responsive.mjs
      - name: Adjuntar capturas si falla alguna pantalla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failures
          path: web/responsive-artifacts/
          if-no-files-found: ignore

  
  diagnostico_preparador_real:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Lectura de estructuras y agregados recientes en producción
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='45000ms';
          SELECT 'RELACIONES' AS control,n.nspname,c.relname,c.relkind
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='ampedia' AND c.relname IN
            ('fm_ventas_analitica','fm_ventas_cabeceras','fm_ventas_lineas','articulos');
          SELECT 'COLUMNAS' AS control,table_name,column_name,data_type
          FROM information_schema.columns
          WHERE table_schema='ampedia' AND table_name IN ('articulos','fm_ventas_analitica')
            AND column_name IN ('farmacia_codigo','articulo_id','origen_id','nombre','stock_actual','codigo_nacional','sincronizado_en','fecha','unidades')
          ORDER BY table_name,column_name;
          SELECT 'FARMACIAS' AS control,id,codigo_origen,cliente_slug
          FROM farmetrica.farmacias WHERE cliente_slug='ampedia' ORDER BY id;
          SELECT 'CATA' AS control,farmacia_codigo,count(*) AS referencias
          FROM ampedia.articulos WHERE farmacia_codigo IN ('ABA','EUR','BUE','EST','VAL')
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'VENTAS_7D' AS control,farmacia_codigo,count(*) AS documentos
          FROM ampedia.fm_ventas_cabeceras
          WHERE fecha >= current_date - interval '7 days'
            AND lineas_completas AND NOT eliminado_logicamente
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'ANALITICA_7D' AS control,farmacia_codigo,count(*) AS lineas,
            count(DISTINCT articulo_id) AS articulos,
            sum(unidades)::float8 AS unidades
          FROM ampedia.fm_ventas_analitica
          WHERE fecha >= current_date - interval '7 days'
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'OPERATIVA' AS control,
            to_regclass('farmetrica.op_pedidos') IS NOT NULL AS pedidos,
            to_regclass('farmetrica.op_politicas_reposicion') IS NOT NULL AS politicas,
            to_regclass('farmetrica.nomenclator_presentaciones') IS NOT NULL AS nomenclator;
          SELECT 'CACHE' AS control,farmacia_id,analisis_meses,desde,hasta,
           calculado_en,referencias FROM farmetrica.ventas_analitica_estado
          WHERE cliente_slug='ampedia' AND analisis_meses IN (3,12)
          ORDER BY farmacia_id,analisis_meses LIMIT 20;
          ROLLBACK;
          SQL
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T api node --input-type=module -' <<'JS'
          import pg from "pg";
          import {setupPurchasePlanner} from "./src/purchasePlanner.js";
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:2,
           connectionTimeoutMillis:5000,statement_timeout:30000,query_timeout:35000});
          const routes={},app={get(path,...handlers){routes[path]=handlers.at(-1)}};
          setupPurchasePlanner(app,pool,{requireTenant:()=>[]});
          const pharmacies=[
           {id:1,name:"Abadía"},{id:2,name:"Europa"},
           {id:3,name:"Buenavista"},{id:4,name:"Estación"},{id:5,name:"Valdemarías"}];
          const context={role:"superadministrador",modules:{compras:true},
           client:{slug:"ampedia",schema:"ampedia"},pharmacies};
          for(const ids of ["1","1,2,3,4,5"]){
           const start=Date.now();let response=null,failure=null,status=200;
           const res={status(s){status=s;return this},json(data){response=data;return this}};
           const req={query:{desde:"2026-10-01",hasta:"2026-10-21",farmacias:ids,buscar:""},context};
           await routes["/api/analytics/pedidos/propuesta"](req,res,e=>{failure=e});
           console.log("ENDPOINT_PLAN",ids,"status",status,"ms",Date.now()-start,
            "groups",response?.groups?.length??null,"available",response?.available??null,
            "error",failure?.code||failure?.message||response?.error||response?.reason||"none");
          }
          await pool.end();
          JS
      - name: Ejecutar nuevo planificador sobre producción sin desplegarlo
        run: |
          set -euo pipefail
          {
            printf 'const plannerSource = Buffer.from("'
            base64 -w0 api/src/purchasePlanner.js
            printf '","base64").toString("utf8");\n'
            cat <<'JS'
          import pg from "pg";
          const inline='const pharmacyDataCodeSQL=(alias="f")=>\x60(CASE WHEN \x24{alias}.cliente_slug=\x27ampedia\x27 AND \x24{alias}.id=5 AND upper(btrim(\x24{alias}.codigo_origen)) IN (\x27POL\x27,\x27VAL\x27) THEN \x27VAL\x27 ELSE upper(btrim(\x24{alias}.codigo_origen)) END)\x60;';
          const modified=plannerSource.replace(/^import \{pharmacyDataCodeSQL\} from .*?;\s*/m,inline);
          const module=await import("data:text/javascript;base64,"+Buffer.from(modified).toString("base64"));
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:3,
           connectionTimeoutMillis:5000,statement_timeout:30000,query_timeout:35000});
          const routes={},app={get(path,...handlers){routes[path]=handlers.at(-1)}};
          module.setupPurchasePlanner(app,pool,{requireTenant:()=>[]});
          const pharmacies=[{id:1,name:"Abadía"},{id:2,name:"Europa"},
            {id:3,name:"Buenavista"},{id:4,name:"Estación"},{id:5,name:"Valdemarías"}];
          const context={role:"superadministrador",modules:{compras:true},
           client:{slug:"ampedia",schema:"ampedia"},pharmacies};
          for(const ids of ["1","1,2,3,4,5"]){
           const start=Date.now();let response=null,failure=null,status=200;
           const res={status(s){status=s;return this},json(data){response=data;return this}};
           await routes["/api/analytics/pedidos/propuesta"]({
             query:{desde:"2026-10-01",hasta:"2026-10-21",farmacias:ids,buscar:""},context
            },res,e=>{failure=e});
           console.log("ENDPOINT_NUEVO",ids,"status",status,"ms",Date.now()-start,
            "groups",response?.groups?.length??null,"available",response?.available??null,
            "first",response?.groups?.[0]?.articleName?.slice(0,45)||"none",
            "sales",response?.groups?.slice(0,10).reduce((n,g)=>n+g.unitsPeriod,0)??null,
            "error",failure?.code||failure?.message||response?.error||response?.reason||"none");
          }
          await pool.end();
          JS
          } | ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T api node --input-type=module -'
