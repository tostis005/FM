name: Diagnostico de recepciones de almacen (solo lectura)
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-warehouse-receipts-readonly.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar acceso de diagnostico
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Consulta transaccional de solo lectura y resultado cifrado
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/pub.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArjCfmourJJHFUDQAN3bo
          w+yHH0+Upi1s8a6zv07k9sTOiR/k1mmsPoHzf9xSizvtF6uCqLE/Zg32O4DCyHkx
          KjvB5AmA5drddtE7ra1fDZKwHF4h8hk6a46kA3eY+p8Hlbhph7m+D9oiPSCm5UG3
          oR6hPjuFhPaluILseJZWTj51jiBB3ePC66iw7sm1xkfRVjh9uwy8LGLijAm1QHxa
          pYVNYdkVuhPFqMx+44x4njJ1lKryVnlqbMaMnUBKOReCA3FT9UEnKw5BtdBHANZP
          yMltOPgiLIBv5t+hiVCI3Vo06R8idaLG7hHOCqkenZ+0+sS1StFmrBcaSmjx3cRP
          RXJ4FxMtaOQzXkqvR38s93e5nPRYf1FHtPVQTuCDpU2NOlHegOY6X8HcHbIZoywF
          tJ3WjaAbggdK5y0spLEycVRFdJG3TWh2x1jWkpokrbo0ApE278fgOmjOIqLQ5ZdA
          Vo0PiSW/0q146EBhQ8vZCa8wlEa3BT8KX0SsIr428X4FAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          if ! ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -qAt -v ON_ERROR_STOP=1 -U farmawao -d farmawao' > "$work/result" 2>"$work/error" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='60s';
          SET LOCAL lock_timeout='3s';
          SELECT 'source',farmacia_codigo,sistema_origen,count(DISTINCT documento_id),count(*),sum(unidades),round(sum(importe)::numeric,2)
          FROM ampedia.fm_recepciones_analitica
          WHERE farmacia_codigo IN ('AMP','ALMACEN') AND ltrim(btrim(proveedor_id::text),'0')='4047'
           AND fecha >= '2026-01-01' AND fecha < '2026-12-01'
          GROUP BY 2,3 ORDER BY 2,3;
          WITH r AS MATERIALIZED (
           SELECT farmacia_codigo,sistema_origen,documento_id,linea_id,articulo_id,unidades,importe
           FROM ampedia.fm_recepciones_analitica
           WHERE farmacia_codigo IN ('AMP','ALMACEN') AND ltrim(btrim(proveedor_id::text),'0')='4047'
            AND fecha >= '2026-01-01' AND fecha < '2026-12-01'
          ), dup AS (
           SELECT documento_id,linea_id,articulo_id,unidades,importe,count(*) AS n
           FROM r GROUP BY 1,2,3,4,5 HAVING count(*)>1
          )
          SELECT 'identical',count(*),count(DISTINCT documento_id),coalesce(sum((n-1)*unidades),0),round(coalesce(sum((n-1)*importe),0)::numeric,2) FROM dup;
          WITH lab AS (
           SELECT DISTINCT proveedor_id FROM farmetrica.proveedores_unificados_alias
           WHERE cliente_slug='ampedia' AND upper(btrim(farmacia_codigo)) IN ('AMP','ALMACEN')
            AND ltrim(btrim(codigo_origen),'0')='4047'
          ), aliases AS (
           SELECT DISTINCT upper(btrim(a.farmacia_codigo)) AS site,
            CASE WHEN btrim(a.codigo_origen)~'^[0-9]+$' THEN coalesce(nullif(ltrim(btrim(a.codigo_origen),'0'),''),'0') ELSE upper(btrim(a.codigo_origen)) END AS code
           FROM farmetrica.proveedores_unificados_alias a JOIN lab ON lab.proveedor_id=a.proveedor_id
           WHERE a.cliente_slug='ampedia' AND upper(btrim(a.farmacia_codigo)) IN ('AMP','ALMACEN')
          )
          SELECT 'mapped',a.site,a.code,count(DISTINCT v.documento_id),sum(v.unidades),round(sum(v.importe)::numeric,2)
          FROM aliases a LEFT JOIN ampedia.fm_recepciones_analitica v
           ON v.farmacia_codigo=a.site AND (CASE WHEN btrim(v.proveedor_id::text)~'^[0-9]+$' THEN coalesce(nullif(ltrim(btrim(v.proveedor_id::text),'0'),''),'0') ELSE upper(btrim(v.proveedor_id::text)) END)=a.code
           AND v.fecha >= '2026-01-01' AND v.fecha < '2026-12-01'
          GROUP BY 2,3 ORDER BY 2,3;
          ROLLBACK;
          SQL
          then
            echo "La consulta no se pudo completar; no se publican detalles de produccion."
            exit 1
          fi
          # El repositorio es publico: no registrar importes, documentos ni datos en claro.
          while IFS= read -r line; do
            test -n "$line" || continue
            printf 'FM_AUDIT_ENCRYPTED '
            printf '%s' "$line" | openssl pkeyutl -encrypt -pubin -inkey "$work/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
            printf '\n'
          done < "$work/result"
