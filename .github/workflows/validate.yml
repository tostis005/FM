name: Validar frontend y API

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar API
        run: |
          node --check api/src/server.js
          node --check api/src/accesos.js
          node --check api/src/tenant.js
          python3 -m py_compile deploy/bootstrap-temp-admin-vps.py
          python3 -m py_compile api/src/setup_temp_login.py
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validar formato de CNs
        run: node --test web/src/cns.test.js
      - name: Compilar React
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node --test src/importarPromociones.test.js
          node --test src/objetivosImportacion.test.js
          node --test src/listLogic.test.js
          node --test src/businessAnalytics.test.js
          node --test src/promotionMetrics.test.js
          node --test src/laboratoryExport.test.js
          node check-login.mjs
          node generate-seo.mjs
          node check-marketing.mjs
          node check-theme.mjs
          npm run build

  validar_postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testfm
          POSTGRES_PASSWORD: testfm
          POSTGRES_DB: farmawao
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testfm -d farmawao"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar migraciones SQL y cambio de esquema sin datos perdidos
        shell: bash
        run: |
          set -euo pipefail
          psql_test() {
            docker run --rm -i --network host -e PGPASSWORD=testfm postgres:16-alpine \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U testfm -d farmawao "$@"
          }
          psql_test -c "CREATE SCHEMA farmatic;
            CREATE TABLE farmatic.lineaventa (
              farmacia_origen text, codigo text, descripcion text,
              fechahora timestamp, cantidad numeric
            );
            INSERT INTO farmatic.lineaventa VALUES ('ABA','123456','Test',now(),3);"
          for sql in api/src/migrations/001_farmacias.sql api/src/migrations/002_accesos.sql api/src/migrations/003_multitenant.sql; do
            psql_test --single-transaction < "$sql"
          done
          psql_test --single-transaction < api/src/migrations/005_proveedores.sql
          psql_test < api/src/migrations/004_ampedia_cutover_MANUAL.sql
          psql_test --single-transaction < api/src/migrations/003_multitenant.sql
          result=$(psql_test -At -c "SELECT
            (SELECT count(*) FROM ampedia.lineaventa) = 1
            AND (SELECT count(*) FROM farmatic.lineaventa) = 1
            AND (SELECT esquema_datos FROM farmetrica.clientes WHERE slug='ampedia') = 'ampedia'
            AND (SELECT count(*) FROM farmetrica.superadministradores WHERE email='jose.fraga@gmail.com') = 1
            AND (SELECT count(*) FROM farmetrica.cliente_modulos WHERE cliente_slug='ampedia' AND habilitado) = 1
            AND (SELECT count(*) FROM farmetrica.farmacias WHERE cliente_slug='ampedia') = 5;")
          test "$result" = t
          psql_test -At -c "INSERT INTO farmetrica.proveedores_maestro(cliente_slug,codigo_origen,nombre,tipo) VALUES ('ampedia','COOP01','Cooperativa de prueba CI','cooperativa');" >/dev/null
          psql_test -At -c "SELECT count(*) FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND tipo='cooperativa';" | grep -qx 1


  validar_responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de prueba y dependencias web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Comprobar móviles, tablets, escritorio y tablas
        working-directory: web
        run: |
          set -euo pipefail
          node generate-seo.mjs
          npm run dev -- --port 4175 --strictPort > /tmp/farmetrica-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4175/promociones >/dev/null; then break; fi
            sleep 1
          done
          node check-responsive.mjs
          node check-public-responsive.mjs
      - name: Adjuntar capturas si falla alguna pantalla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failures
          path: web/responsive-artifacts/
          if-no-files-found: ignore
