  validar_responsive:
    # Playwright 1.56 no soporta Chromium en ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de prueba y dependencias web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Comprobar móviles, tablets, escritorio y tablas
        working-directory: web
        run: |
          set -euo pipefail
          node generate-seo.mjs
          npm run dev -- --port 4175 --strictPort > /tmp/farmetrica-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4175/promociones >/dev/null; then break; fi
            sleep 1
          done
          node check-superadmin-proactive-menu.mjs
          node check-master-sources.mjs
          node check-familias-maestro.mjs
          node check-user-modules.mjs
          node check-profiles-manager.mjs
          node check-ajustes-gestor.mjs
          node check-picking-settings.mjs
          node check-picking-live-data.mjs
          node check-picking-table-capacity.mjs
          node check-warehouse-edit.mjs
          node check-genericos.mjs
          node check-laboratory-orders.mjs
          node check-supplier-laboratory-map.mjs
          node check-supplier-views.mjs
          node check-supplier-directory-roles.mjs
          node check-purchase-planner.mjs
          node check-savings-analysis.mjs
          node check-dashboard-audit.mjs
          node check-responsive.mjs
          node check-sales-loading.mjs
          node check-laboratory-performance.mjs
          node check-ventas-compras-datos.mjs
          node check-recepciones.mjs
          node check-recepciones-completas.mjs
          node check-refresh-navigation.mjs
          node check-navigation-arrows.mjs
          node check-promotions-delete.mjs
          node check-promotions-bulk-activation.mjs
          node check-promotions-persistence.mjs
          node check-promotions-scope.mjs
          node check-tracking-navigation-presentation.mjs
          node check-traspasos-salientes.mjs
          node check-promotions-import.mjs
          node check-promotions-import-mobile.mjs
          node check-promotion-objectives-flow.mjs
          node check-promotion-sales-activation-flow.mjs
          node check-promotion-future-publication.mjs
          node check-operativa.mjs
          node check-demo-v1.mjs
          node check-pantallas-reales.mjs
          python3 -m http.server 4176 --bind 127.0.0.1 --directory public > /tmp/farmetrica-public.log 2>&1 &
          for i in $(seq 1 25); do if curl --silent --fail http://127.0.0.1:4176/landing.html >/dev/null; then break; fi; sleep 1; done
          node check-public-responsive.mjs
      - name: Adjuntar capturas si falla alguna pantalla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failures
          path: web/responsive-artifacts/
          if-no-files-found: ignore

  validar_ahorro_postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testfm
          POSTGRES_PASSWORD: testfm
          POSTGRES_DB: farmawao
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testfm -d farmawao"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar cliente PostgreSQL y verificar analítica sin tocar producción
        env:
          FM_SAVINGS_PG_TEST: "1"
          DATABASE_URL: postgresql://testfm:testfm@127.0.0.1:5432/farmawao
        run: |
          npm install --prefix api --no-audit --no-fund
          node --test api/src/savingsAnalysis.pg.test.js


  validar_retirada_almacen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testfm
          POSTGRES_PASSWORD: testfm
          POSTGRES_DB: farmawao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testfm -d farmawao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar retirada y respaldo en PostgreSQL aislado
        shell: bash
        run: |
          set -euo pipefail
          psql_test() {
