# Resolver esquema público tras el proxy TLS, sin asumir el dominio de producción.
map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_tokens off;

  # Comprimir JS, CSS, JSON y SVG en las recargas sin caché (Ctrl+F5).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
  root /usr/share/nginx/html;
  index index.html;

  # Las páginas públicas tienen URL canónica absoluta sin fijar aquí el dominio.
  # No modifica los enlaces de navegación ni las páginas privadas.
  sub_filter_once off;
  sub_filter '<link rel="canonical" href="/' '<link rel="canonical" href="$public_scheme://$host/';

  # Re-resolver el servicio Docker cuando la API se recree sin reiniciar Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $farmawao_api "api:8000";

  # Metadatos OAuth de MCP; sin acceso a datos y sin usar la cookie de la SPA.
  location ^~ /.well-known/oauth- {
    proxy_pass http://$farmawao_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header Cache-Control "no-store" always;
  }

  # La URL temporal contiene una credencial. No registrar la ruta completa.
  location ^~ /api/consulta-temporal/ {
    access_log off;
    proxy_pass http://$farmawao_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # La API hace su propia comprobación de roles, sesiones y CSRF.
  location /api/ {
    proxy_pass http://$farmawao_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Sitio comercial público, separado de los bundles internos de React.
  # La raíz nunca sirve la SPA privada, ni siquiera con una sesión activa.
  location = / {
    try_files /landing.html =404;
    default_type text/html;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /landing.html { return 404; }
  # Robots y sitemap emplean el hostname HTTPS público del proxy.
  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    return 200 "User-agent: *\nAllow: /\nDisallow: /login\nDisallow: /dashboard\nDisallow: /ventas\nDisallow: /compras\nDisallow: /proveedores\nDisallow: /stock\nDisallow: /reposicion\nDisallow: /genericos\nDisallow: /rentabilidad\nDisallow: /acciones\nDisallow: /informes\nDisallow: /asistente\nDisallow: /promociones\nDisallow: /seguimiento\nDisallow: /farmacias\nDisallow: /usuarios\nDisallow: /accesos\nDisallow: /solicitudes\nDisallow: /ajustes\nDisallow: /clientes\nDisallow: /proveedores-maestro\nDisallow: /sincronizacion\nDisallow: /api/\nDisallow: /index.html\nDisallow: /assets/\nSitemap: $public_scheme://$host/sitemap.xml\n";
  }
  # El archivo se genera en cada build con las URLs públicas existentes.
  # Se inserta el origen de la petición para que <loc> sea siempre absoluto.
  location = /sitemap.xml {
    default_type application/xml;
    sub_filter_types application/xml text/xml;
    sub_filter_once off;
    sub_filter '__FARMETRICA_SITE_ORIGIN__' '$public_scheme://$host';
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # Logo corporativo compartido por el sitio público, acceso y SPA privada.
  location = /brand-logo.webp {
    try_files /brand-logo.webp =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /brand-symbol.svg {
    try_files /brand-symbol.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /favicon.svg {
    try_files /favicon.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /marketing.css {
    try_files /marketing.css =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # Solicitud comercial pública, sin sesión. JS e imágenes permanecen estáticos.
  # Información y ejercicio de derechos: acceso público.
  location = /privacidad { return 301 /privacidad/; }
  location = /privacidad/solicitud { return 301 /privacidad/solicitud/; }
  location ^~ /privacidad/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /solicitar-demo { return 301 /solicitar-demo/; }
  location ^~ /solicitar-demo/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /soluciones { return 301 /soluciones/; }
  location ^~ /soluciones/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /integraciones { return 301 /integraciones/; }
  location ^~ /integraciones/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /blog { return 301 /blog/; }
  location ^~ /blog/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Script propio de medición agregada, sin cookies, accesible desde las páginas públicas.
  location = /metricas.js {
    try_files /metricas.js =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # Inicio de sesión público; los datos y la SPA continúan protegidos.
  location = /login {
    alias /usr/share/nginx/html/login.html;
    # /login no tiene extension; por defecto Nginx responde octet-stream.
    # Servir siempre como HTML para evitar que el navegador descargue login.bin.
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /login.html { return 404; }
  location = /favicon.ico { return 404; }

  location = /__authcheck {
    internal;
    proxy_pass http://$farmawao_api/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location @login_redirect {
    return 302 /login?next=$request_uri;
  }

  # Vite asigna un hash de contenido a cada bundle. Reutilizar sólo esos
  # archivos inmutables; los HTML y los datos autenticados siguen sin caché.
  # Se mantiene auth_request: nunca se entregan bundles nuevos sin sesión.
  location ^~ /assets/ {
    auth_request /__authcheck;
    error_page 401 = @login_redirect;
    try_files $uri =404;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Todas las rutas de la SPA, sus bundles JS/CSS y activos privados requieren cookie válida.
  # Sin backend disponible, Nginx no entrega la aplicación (fail closed).
  location / {
    auth_request /__authcheck;
    error_page 401 = @login_redirect;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }
}
