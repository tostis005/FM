name: Verificar Demo MCP con datos PostgreSQL y OAuth
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: El MCP demo consulta PostgreSQL solo tras autenticar
        shell: bash
        run: |
          set -euo pipefail
          origin=https://farmetrica.com
          curl -fsS --max-time 15 "$origin/.well-known/oauth-protected-resource/api/mcp-demo" > /tmp/demo-oauth.json
          python3 - <<'PY'
          import json
          metadata=json.load(open('/tmp/demo-oauth.json'))
          assert metadata['resource']=='https://farmetrica.com/api/mcp-demo'
          assert metadata['authorization_servers']==['https://farmetrica.com']
          PY
          for endpoint in mcp-demo mcp; do
            for method in initialize tools/list tools/call; do
              status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\"}" \
                "$origin/api/$endpoint")
              test "$status" = 401 || { echo "$endpoint $method sin sesión OAuth: HTTP $status"; exit 1; }
            done
          done
          echo "MCP demo y MCP principal: acceso real protegido por OAuth"
