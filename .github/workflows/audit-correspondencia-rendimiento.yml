name: Auditar farmacias e índices operativos
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-correspondencia-rendimiento.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Auditar correspondencias reales y configuración de índices sin modificar datos
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          SET statement_timeout = '25s';
          SELECT id AS farmacia_id, nombre, codigo_origen, activo
          FROM farmetrica.farmacias WHERE cliente_slug='ampedia' ORDER BY id;
          SELECT tablename,attname,most_common_vals,most_common_freqs
          FROM pg_stats WHERE schemaname='ampedia'
            AND tablename IN ('ventas','compras','articulos','proveedores')
            AND attname IN ('farmacia_codigo','farmacia')
          ORDER BY tablename,attname;
          SELECT f.id,f.nombre,f.codigo_origen,coalesce(st.filas,0) AS stocks,
            st.ultima_importacion
          FROM farmetrica.farmacias f LEFT JOIN
            (SELECT id_farmacia,count(*) filas,max(importado_en) ultima_importacion
             FROM public.stock_farmacia GROUP BY id_farmacia) st ON st.id_farmacia=f.id
          WHERE f.cliente_slug='ampedia' ORDER BY f.id;
          SELECT ns.nspname AS esquema,tab.relname AS tabla,
             idx.relname AS indice, pi.indisvalid AS valido,
             pi.indisready AS preparado
          FROM pg_class tab JOIN pg_namespace ns ON ns.oid=tab.relnamespace
          JOIN pg_index pi ON pi.indrelid=tab.oid
          JOIN pg_class idx ON idx.oid=pi.indexrelid
          WHERE ns.nspname IN ('ampedia','farmetrica')
            AND tab.relname IN ('ventas','compras','articulos','proveedores','farmacias')
          ORDER BY ns.nspname,tab.relname,idx.relname;
          SELECT schemaname,relname,n_live_tup,n_dead_tup,last_analyze,last_autoanalyze,
            seq_scan,idx_scan,pg_size_pretty(pg_total_relation_size(relid)) AS tamaño_total
          FROM pg_stat_user_tables WHERE schemaname='ampedia'
            AND relname IN ('ventas','compras','articulos','proveedores')
          ORDER BY relname;
          SQL