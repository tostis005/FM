name: Diagnóstico de preparador (solo lectura)
on:
  push:
    branches: [fix/preparador-datos-reales-20261021]
    paths: [".github/workflows/diagnostico-preparador.yml"]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar acceso SSH al servidor
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Contrastar estructura, farmacias, ventas y stock real
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='45000ms';
          SELECT 'RELACIONES' AS control,n.nspname,c.relname,c.relkind
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='ampedia' AND c.relname IN
            ('fm_ventas_analitica','fm_ventas_cabeceras','fm_ventas_lineas','articulos');
          SELECT 'COLUMNAS' AS control,table_name,column_name,data_type
          FROM information_schema.columns
          WHERE table_schema='ampedia' AND table_name IN ('articulos','fm_ventas_analitica')
            AND column_name IN ('farmacia_codigo','articulo_id','origen_id','nombre','stock_actual','codigo_nacional','sincronizado_en','fecha','unidades')
          ORDER BY table_name,column_name;
          SELECT 'FARMACIAS' AS control,id,codigo_origen,cliente_slug
          FROM farmetrica.farmacias WHERE cliente_slug='ampedia' ORDER BY id;
          SELECT 'CATA_3' AS control,farmacia_codigo,count(*) AS referencias
          FROM ampedia.articulos WHERE farmacia_codigo IN ('ABA','EUR','BUE','EST','VAL')
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'VENTAS_7D' AS control,farmacia_codigo,count(*) AS documentos
          FROM ampedia.fm_ventas_cabeceras
          WHERE fecha >= current_date - interval '7 days'
            AND lineas_completas AND NOT eliminado_logicamente
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'ANALITICA_7D' AS control,farmacia_codigo,count(*) AS lineas,
            count(DISTINCT articulo_id) AS articulos,
            sum(unidades)::float8 AS unidades
          FROM ampedia.fm_ventas_analitica
          WHERE fecha >= current_date - interval '7 days'
          GROUP BY farmacia_codigo ORDER BY farmacia_codigo;
          SELECT 'OPERATIVA' AS control,
            to_regclass('farmetrica.op_pedidos') IS NOT NULL AS pedidos,
            to_regclass('farmetrica.op_politicas_reposicion') IS NOT NULL AS politicas,
            to_regclass('farmetrica.nomenclator_presentaciones') IS NOT NULL AS nomenclator;
          ROLLBACK;
          SQL
