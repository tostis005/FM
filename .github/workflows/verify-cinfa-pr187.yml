name: Comprobación final Cinfa en producción
on:
  push:
    branches: ["diag/verify-cinfa-pr187-20261025"]
    paths: [".github/workflows/verify-cinfa-pr187.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Preparar conexión temporal
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/ci
          chmod 600 ~/.ssh/ci
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Medir consulta de ventas por identificador indexado
        run: |
          set -euo pipefail
          cat <<'NODE' | ssh -i ~/.ssh/ci -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T api node --input-type=module -'
          import pg from "pg";
          import {readFile} from "node:fs/promises";
          import {pharmacyDataCodeSQL} from "./src/pharmacyCodes.js";
          const db=new pg.Pool({connectionString:process.env.DATABASE_URL,max:2,connectionTimeoutMillis:6000});
          try{
           const {rows}=await db.query(`SELECT f.id,n.cn
             FROM ampedia.articulos a JOIN farmetrica.farmacias f
               ON f.cliente_slug='ampedia' AND upper(btrim(a.farmacia_codigo))=upper(btrim(f.codigo_origen))
             JOIN farmetrica.nomenclator_presentaciones n ON n.cn=btrim(a.origen_id::text)
             WHERE (n.laboratorio_titular ILIKE '%cinfa%' OR n.laboratorio_comercializador ILIKE '%cinfa%')
              AND coalesce(a.stock_actual,0)<>0 LIMIT 1`);
           const {id,cn}=rows[0];
           let sql=await readFile("./src/laboratoryOrderMetrics.sql","utf8");
           sql=sql.replaceAll("__SCHEMA__",'"ampedia"').replaceAll("__FARMACIA_CODE__",pharmacyDataCodeSQL("f"));
           const newer=sql.replace("upper(btrim(v.farmacia_codigo))=(", "v.farmacia_codigo=(")
             .replace("v.articulo_id::text=a.article_id","v.articulo_id=a.article_id");
           const args=[JSON.stringify([{reference:cn,cn}]),[id],"ampedia","2026-10-01","2026-10-24"];
           let started=Date.now();
           const q=await db.query({text:newer,values:args,query_timeout:30000});
           console.log("CINFA_INDEXED_METRICS",JSON.stringify({durationMs:Date.now()-started,
            count:q.rows.length,stock:q.rows[0]?.stock,units3:q.rows[0]?.units3,
            units12:q.rows[0]?.units12,unitsPeriod:q.rows[0]?.unitsPeriod}));
          }finally{await db.end()}
          NODE
