name: Verificar protección del MCP demo con datos reales
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar API Key requerida y OAuth principal intacto
        shell: bash
        run: |
          set -euo pipefail
          demo=https://farmetrica.com/api/mcp-demo
          private=https://farmetrica.com/api/mcp
          for method in initialize tools/list tools/call; do
            demo_status=$(curl -sS --max-time 15 -o /tmp/mcp_demo.json -w '%{http_code}' \
              -H 'Content-Type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\"}" "$demo")
            test "$demo_status" = 401 || { echo "El MCP demo no requiere API Key: $demo_status"; exit 1; }
          done
          main_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$private")
          test "$main_status" = 401 || { echo "MCP OAuth privado dejó de estar protegido: $main_status"; exit 1; }
          echo "MCP demo con clave obligatoria y MCP real con OAuth"
