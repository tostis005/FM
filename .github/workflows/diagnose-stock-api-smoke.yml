name: Verificar rendimiento real stock sin recepciones (solo lectura)
on:
  push:
    branches: [diagnostic/stock-api-real-smoke-20261028]
    paths: [".github/workflows/diagnose-stock-api-smoke.yml"]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configurar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Ejecutar SQL exacto del backend publicado y nombres comerciales (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose -f compose.yaml -f compose.farmacias.yml exec -T api node --input-type=module -' <<'JS'
          import pg from "pg";
          import {performance} from "node:perf_hooks";
          import {buildStockSinRecepcionesSQL} from "./src/stockSinRecepciones.js";
          import {nameCommercialRows} from "./src/commercialNames.js";
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,
            max:1,connectionTimeoutMillis:5000});
          const sql=buildStockSinRecepcionesSQL("ampedia");
          const {rows:pharmacies}=await pool.query(
            "SELECT id FROM farmetrica.farmacias WHERE cliente_slug=$1 ORDER BY id",["ampedia"]);
          const ids=pharmacies.map(p=>Number(p.id));
          if(ids.length<1)throw Error("No hay farmacias para el diagnóstico");
          console.log("STOCK_API_PHARMACIES="+ids.length);
          const scenarios=[
            {label:"default-2y-50-p1",cutoff:"2024-10-28",page:1,size:50,ids},
            {label:"default-2y-100-p1",cutoff:"2024-10-28",page:1,size:100,ids},
            {label:"default-2y-50-p2",cutoff:"2024-10-28",page:2,size:50,ids},
            {label:"preset-1y-50",cutoff:"2025-10-28",page:1,size:50,ids},
            {label:"preset-3y-50",cutoff:"2023-10-28",page:1,size:50,ids},
            {label:"preset-5y-50",cutoff:"2021-10-28",page:1,size:50,ids},
            {label:"single-pharmacy-2y-50",cutoff:"2024-10-28",page:1,size:50,ids:ids.slice(0,1)}
          ];
          for(const s of scenarios){
            const c=await pool.connect();
            const start=performance.now();
            try{
              await c.query("BEGIN READ ONLY");
              await c.query("SET LOCAL statement_timeout='22000ms'");
              const {rows}=await c.query({text:sql,values:[
                s.cutoff,s.ids,"ampedia","",s.size+1,(s.page-1)*s.size
              ]});
              const named=await nameCommercialRows(c,{
                client:{slug:"ampedia",schema:"ampedia"},
                allowedPharmacyIds:s.ids
              },rows.slice(0,s.size));
              console.log("STOCK_SMOKE="+JSON.stringify({case:s.label,
                elapsedMs:Math.round(performance.now()-start),
                pageRows:named.length,hasMore:rows.length>s.size,
                namedSupplierRows:named.filter(r=>r.supplierName).length,
                withinClientTimeout:true}));
              await c.query("ROLLBACK");
            }catch(e){
              console.log("STOCK_SMOKE="+JSON.stringify({case:s.label,
                elapsedMs:Math.round(performance.now()-start),
                errorCode:e.code||e.name||"unknown",errorMessageType:e.code==="57014"?"timeout":"error",
                withinClientTimeout:false}));
              await c.query("ROLLBACK").catch(()=>{});
            }finally{c.release();}
          }
          await pool.end();
          JS
      - name: Contabilizar solo códigos de errores del informe en logs recientes
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
           'cd /opt/farmawao && docker compose -f compose.yaml -f compose.farmacias.yml logs --since 75m --no-color api' \
           | grep 'Error consultando stock sin recepciones' \
           | sed -E 's/.*Error consultando stock sin recepciones /STOCK_RECENT_ERROR_CODE=/' \
           | sort | uniq -c || true
