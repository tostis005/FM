name: Medir análisis por laboratorio en producción
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bench-ventas-laboratorios
  cancel-in-progress: true
jobs:
  medir:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Comprobar cambio relevante
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff HEAD^ HEAD --name-only | grep -Eq '^(api/src/(salesLaboratories|benchSalesLaboratories)\.js|\.github/workflows/bench-ventas-laboratorios\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar SSH
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Medir seis meses reales sin imprimir importes ni artículos
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose -f compose.yaml -f compose.farmacias.yml exec -T -e FM_BENCHMARK_READONLY=1 api node src/benchSalesLaboratories.js'
