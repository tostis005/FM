name: Auditar propuestas del Transferidor
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-transferidor.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configurar acceso protegido
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Auditoría agregada y de solo lectura del stock y los sinónimos en producción
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T db psql -X -P pager=off -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='65000ms';
          SELECT 'FARMACIAS_ACTIVAS' AS tipo, count(*)::int AS cantidad FROM farmetrica.farmacias f
           WHERE f.cliente_slug='ampedia' AND f.activo=true
            AND coalesce(to_jsonb(f)->>'tipo_establecimiento','farmacia')='farmacia';
          SELECT 'STOCK_POR_FARMACIA' AS tipo, upper(btrim(a.farmacia_codigo)) AS codigo,
           count(*)::int AS fichas,
           count(*) FILTER(WHERE a.stock_actual>0)::int AS fichas_stock,
           count(*) FILTER(WHERE a.stock_actual>0 AND btrim(coalesce(a.codigo_nacional,''))~'^[0-9]{6,7}$')::int AS stock_con_cn,
           count(*) FILTER(WHERE a.stock_actual>0 AND btrim(coalesce(to_jsonb(a)->>'cn_normalizado',''))~'^[0-9]{6,7}$')::int AS stock_cn_normalizado
          FROM ampedia.articulos a GROUP BY 2 ORDER BY 2;
          SELECT 'FICHAS_FORMATO' AS tipo,
           count(*) FILTER(WHERE stock_actual>0 AND codigo_nacional IS NULL)::int AS cn_nulos,
           count(*) FILTER(WHERE stock_actual>0 AND btrim(coalesce(codigo_nacional,''))='')::int AS cn_vacios,
           count(*) FILTER(WHERE stock_actual>0 AND btrim(coalesce(codigo_nacional,''))~'^[0-9]{8,14}$')::int AS cn_ean,
           count(*) FILTER(WHERE stock_actual>0 AND btrim(origen_id::text)~'^[0-9]{6,7}$')::int AS id_erp_seis_siete,
           count(*) FILTER(WHERE stock_actual>0 AND btrim(origen_id::text)~'^[0-9]{8,14}$')::int AS id_erp_ean
          FROM ampedia.articulos;
          SELECT 'SINONIMOS_TOTALES' AS tipo,count(*)::int AS filas,
           count(*) FILTER(WHERE btrim(s.codigo)~'^[0-9]{8,14}$')::int AS ean_validos,
           count(*) FILTER(WHERE btrim(s.codigo)~'^[0-9]{6,7}$')::int AS cn_validos
          FROM ampedia.sinonimos s;
          SELECT 'SINONIMOS_POR_FARMACIA' AS tipo,upper(btrim(s.farmacia_codigo)) AS farmacia,
           count(*)::int AS filas,
           count(*) FILTER(WHERE btrim(s.codigo)~'^[0-9]{8,14}$')::int AS ean_validos,
           count(DISTINCT btrim(s.codigo))::int AS codigos
          FROM ampedia.sinonimos s GROUP BY 2 ORDER BY 2;
          SELECT 'EAN_EN_STOCK' AS tipo,upper(btrim(a.farmacia_codigo)) AS farmacia,
           count(*)::int AS articulos_con_ean,
           count(*) FILTER(WHERE a.stock_actual>0)::int AS con_stock_positivo
          FROM ampedia.articulos a JOIN ampedia.sinonimos s
           ON upper(btrim(a.farmacia_codigo))=upper(btrim(s.farmacia_codigo))
           AND a.origen_id::text=s.articulo_id::text
          WHERE btrim(s.codigo)~'^[0-9]{8,14}$'
          GROUP BY 2 ORDER BY 2;
          WITH linked AS MATERIALIZED(
           SELECT upper(btrim(s.farmacia_codigo)) AS farmacia,btrim(s.codigo) AS ean,
             max(a.stock_actual) AS stock
           FROM ampedia.sinonimos s JOIN ampedia.articulos a
            ON upper(btrim(a.farmacia_codigo))=upper(btrim(s.farmacia_codigo))
            AND a.origen_id::text=s.articulo_id::text
           WHERE btrim(s.codigo)~'^[0-9]{8,14}$'
           GROUP BY 1,2
          )
          SELECT 'EAN_COMPARTIDOS' AS tipo,count(*)::int AS referencias_en_varias,
           count(*) FILTER(WHERE hay_stock)::int AS con_stock
          FROM (SELECT ean,bool_or(stock>0) AS hay_stock FROM linked
           GROUP BY ean HAVING count(DISTINCT farmacia)>1) x;
          ROLLBACK;
          SQL
      - name: Confirmar versión de API desplegada
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            cd /opt/farmawao
            echo VERSION_TRANSFERIDOR
            test -f api/src/transferidor.js && grep -c "const emptyReason" api/src/transferidor.js || true
          '
