# Override complementario sin publicar secretos en Git.
# Credenciales en /opt/farmawao/.env. Piloto IA activo con modelo fijo y solo lectura.
services:
  api:
    environment:
      # Rollback inmediato: FM_PREPARADOR_ULTIMA_RECEPCION=0 y recrear api.
      FM_PREPARADOR_ULTIMA_RECEPCION: ${FM_PREPARADOR_ULTIMA_RECEPCION:-1}
      AI_ENABLED: 'true'
      # Piloto privado, habilitado únicamente con OAuth y herramientas de solo lectura.
      # El usuario de despliegue no necesita modificar el .env protegido de Contabo.
      # Para detenerlo, cambiar AI_MCP_ENABLED a 'false' y recrear solo api.
      AI_MCP_ENABLED: 'true'
      AI_MCP_PUBLIC_ORIGIN: 'https://farmetrica.com'
      AI_MODEL: 'qwen3:0.6b'
      AI_OLLAMA_URL: http://ollama:11434
      AI_VOICE_ENABLED: ${AI_VOICE_ENABLED:-false}
      AI_WHISPER_URL: http://whisper:8080
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-}
      ADMIN_OIDS: ${ADMIN_OIDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TEMP_ADMIN_EMAIL: ${TEMP_ADMIN_EMAIL:-}
      TEMP_ADMIN_PASSWORD_HASH: ${TEMP_ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
  web:
    build:
      args:
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_LOCAL_LOGIN_ENABLED: 'true'
