name: Preparar cifrado de cambio de contraseña

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rotate-password-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Preparar clave publica en Contabo sin transmitir su parte privada
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/rotate-password-vps.mjs "$VPS_USER@$VPS_HOST:/opt/farmawao/api/rotate-password-vps.mjs"
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            docker run --rm \
              --mount type=bind,src=/opt/farmawao/api,dst=/script,readonly \
              --mount type=bind,src=/opt/farmawao/api_backups,dst=/keys \
              node:22-alpine node /script/rotate-password-vps.mjs init
          '
