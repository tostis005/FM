name: Crear índices operativos de Farmétrica
on:
  workflow_run:
    workflows: ["Build and deploy Farmetrica SaaS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farmetrica-ampedia-operational-indexes
  cancel-in-progress: false
jobs:
  indices:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Detectar índices ya instalados
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          valid=$(ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          SELECT count(*) FROM pg_class idx
           JOIN pg_namespace ns ON ns.oid=idx.relnamespace
           JOIN pg_index ix ON ix.indexrelid=idx.oid
          WHERE ns.nspname='ampedia'
           AND idx.relname=ANY(ARRAY[
            'fm_ventas_codigo_fecha_idx','fm_articulos_codigo_id_sync_idx',
            'fm_compras_codigo_fecha_idx','fm_proveedores_codigo_id_sync_idx',
            'fm_ventas_codigo_articulo_fecha_idx','fm_compras_codigo_articulo_fecha_idx'])
           AND ix.indisvalid AND ix.indisready;
          SQL
          )
          if [ "$valid" = 6 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Todos los índices ya están instalados. No se reconstruyen ni se analizan las tablas."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Se van a instalar los índices pendientes (validados: $valid de 6)."
          fi
      - name: Crear índices concurrentes en PostgreSQL sin bloquear la sincronización
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=15 "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U farmawao -d farmawao' \
            < ops/indices-consultas-operativas.sql
      - name: Comprobar todos los índices válidos
        shell: bash
        run: |
          set -euo pipefail
          found=$(ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' <<'SQL'
          SELECT count(*) FROM pg_class idx
           JOIN pg_namespace ns ON ns.oid=idx.relnamespace
           JOIN pg_index ix ON ix.indexrelid=idx.oid
          WHERE ns.nspname='ampedia'
           AND idx.relname=ANY(ARRAY[
            'fm_ventas_codigo_fecha_idx','fm_articulos_codigo_id_sync_idx',
            'fm_compras_codigo_fecha_idx','fm_proveedores_codigo_id_sync_idx',
            'fm_ventas_codigo_articulo_fecha_idx','fm_compras_codigo_articulo_fecha_idx'])
           AND ix.indisvalid AND ix.indisready;
          SQL
          )
          if [ "$found" != 6 ]; then
            echo "::error::Se esperaban 6 índices válidos; verificados: $found"
            exit 1
          fi
          echo "Los 6 índices operativos están válidos y disponibles."
