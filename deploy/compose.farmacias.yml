# Override complementario; NO reemplaza el compose.yaml de Contabo.
# Valores definidos únicamente en /opt/farmawao/.env (nunca en GitHub).
services:
  api:
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Configure AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:?Configure AZURE_API_CLIENT_ID}
      ADMIN_OIDS: ${ADMIN_OIDS:?Configure ADMIN_OIDS}

  web:
    build:
      args:
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:?Configure VITE_ENTRA_TENANT_ID}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?Configure VITE_ENTRA_CLIENT_ID}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:?Configure VITE_ENTRA_API_SCOPE}
