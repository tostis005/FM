name: Verificación puntual Cinfa preparador
on:
  push:
    branches: ["fix/cinfa-runtime-fast-matrix-20261025"]
    paths: [".github/workflows/verify-cinfa-runtime.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/verify
          chmod 600 ~/.ssh/verify
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - uses: actions/checkout@v4
      - name: Comparar nueva consulta directa desde la rama, sin tocar el servidor
        run: |
          set -euo pipefail
          {
            sed -e 's|"./laboratoryIdentity.js"|"./src/laboratoryIdentity.js"|' \
                -e 's|"./pharmacyCodes.js"|"./src/pharmacyCodes.js"|' api/src/laboratoryFastCatalog.js
            cat <<'NODE'
          import pg from "pg";
          const p=new pg.Pool({connectionString:process.env.DATABASE_URL,max:2,connectionTimeoutMillis:5000});
          const t=()=>Date.now();
          try{
           const {rows:pharmacies}=await p.query("SELECT id FROM farmetrica.farmacias WHERE cliente_slug='ampedia' ORDER BY id");
           const ctx={client:{slug:"ampedia",schema:"ampedia"},pharmacies},ids=pharmacies.map(x=>x.id);
           for(const type of ["medicacion","parafarmacia"]){
            const start=t();
            try{
             const x=await readDirectLaboratoryCatalog(p,ctx,{key:"N:CINFA",pharmacies:ids,type,page:1,size:10,search:""});
             console.log("VERIFY_CANDIDATE",type,JSON.stringify({total:x.total,rows:x.rows.length,ms:t()-start}));
            }catch(e){console.log("VERIFY_CANDIDATE_ERROR",type,JSON.stringify({code:e.code||"",message:e.message.slice(0,100),ms:t()-start}))}
           }
           const explanatory={
            query:async arg=>{
             const planned=await p.query({text:"EXPLAIN (ANALYZE,BUFFERS,FORMAT JSON) "+arg.text,
              values:arg.values,query_timeout:45000});
             const root=planned.rows[0]["QUERY PLAN"][0].Plan;
             const all=[];
             function walk(node,depth=0){
              all.push({node:node["Node Type"],join:node["Join Type"],
               relation:node["Relation Name"],alias:node.Alias,
               ms:Math.round((node["Actual Total Time"]||0)*(node["Actual Loops"]||1)),
               rows:node["Actual Rows"],loops:node["Actual Loops"],
               filtered:node["Rows Removed by Filter"],
               index:node["Index Name"],depth});
              for(const child of node.Plans||[])walk(child,depth+1);
             }
             walk(root);
             console.log("VERIFY_EXPLAIN_SLOW",JSON.stringify(all.sort((a,b)=>b.ms-a.ms).slice(0,18)));
             return {rows:[]};
            }
           };
           await readDirectLaboratoryCatalog(explanatory,ctx,{key:"N:CINFA",pharmacies:ids,type:"parafarmacia",page:1,size:10,search:""});
          }finally{await p.end()}
          NODE
          } | ssh -i ~/.ssh/verify -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T api node --input-type=module -'
      - name: Comparar el SQL de métricas actual y el nuevo sobre CN reales de Cinfa
        run: |
          set -euo pipefail
          {
            printf "import pg from 'pg';\n"
            printf 'const candidate = Buffer.from("%s","base64").toString("utf8");\n' "$(base64 -w0 api/src/laboratoryOrderMetrics.sql)"
            cat <<'NODE'
          import {readFile} from "node:fs/promises";
          import {pharmacyDataCodeSQL} from "./src/pharmacyCodes.js";
          const p=new pg.Pool({connectionString:process.env.DATABASE_URL,max:2,connectionTimeoutMillis:5000});
          try{
           const {rows:ph}=await p.query("SELECT id FROM farmetrica.farmacias WHERE cliente_slug='ampedia'");
           const {rows:matched}=await p.query({text:`
            SELECT DISTINCT n.cn FROM farmetrica.nomenclator_presentaciones n
            JOIN ampedia.articulos a ON a.origen_id::text=n.cn
            WHERE n.laboratorio_titular ILIKE '%cinfa%'
             OR n.laboratorio_comercializador ILIKE '%cinfa%'
            LIMIT 8`,query_timeout:20000});
           console.log("VERIFY_METRIC_CN_SAMPLES",matched.length);
           if(!matched.length)throw Error("No se han localizado CN de Cinfa comprados para la prueba");
           const values=[JSON.stringify(matched.map(r=>({reference:r.cn,cn:r.cn}))),
            ph.map(x=>x.id),"ampedia","2026-10-01","2026-10-25"];
           const old=await readFile("./src/laboratoryOrderMetrics.sql","utf8");
           for(const [label,source] of [["ORIGINAL",old],["CANDIDATE",candidate]]){
            const sql=source.replaceAll("__SCHEMA__",'"ampedia"')
             .replaceAll("__FARMACIA_CODE__",pharmacyDataCodeSQL("f"));
            const start=Date.now();
            try{
             const {rows}=await p.query({text:sql,values,query_timeout:32000});
             console.log("VERIFY_METRICS_"+label,JSON.stringify({
              ms:Date.now()-start,rows:rows.length,
              stock:rows.filter(x=>x.stock!==null).length,
              sales12:rows.filter(x=>Number(x.units12)>0).length,
              salesPeriod:rows.filter(x=>Number(x.unitsPeriod)>0).length
             }));
            }catch(e){console.log("VERIFY_METRICS_ERROR_"+label,JSON.stringify({
              ms:Date.now()-start,code:e.code||"",message:e.message.slice(0,150)
             }))}
           }
          }finally{await p.end()}
          NODE
          } | ssh -i ~/.ssh/verify -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /opt/farmawao && docker compose exec -T api node --input-type=module -'
