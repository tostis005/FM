name: Activar backend de farmacias (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirmo que Microsoft Entra y variables en Contabo estan configuradas"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: farmawao-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar codigo API
        run: |
          node --check api/src/server.js
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Comprobar destino sin publicar credenciales
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            test -f compose.yaml
            test -f .env
            test -d api
            test -w api
            test -w .
            for key in AZURE_TENANT_ID AZURE_API_CLIENT_ID ADMIN_OIDS VITE_ENTRA_TENANT_ID VITE_ENTRA_CLIENT_ID VITE_ENTRA_API_SCOPE; do
              if ! grep -qE "^$key=.+$" .env; then echo "Falta variable: $key"; exit 1; fi
            done
            docker compose config --quiet
          '
      - name: Copiar API y override (no modificar PostgreSQL)
        run: |
          set -euo pipefail
          tar -czf - -C api . | ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            backup="api.backup.$(date +%Y%m%d%H%M%S)"
            cp -a api "$backup"
            tar -xzf - -C api
          '
          scp -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.farmacias.yml "$VPS_USER@$VPS_HOST:/opt/farmawao/compose.farmacias.yml"
      - name: Comprobar compose y desplegar API y web
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/farmawao
            docker compose -f compose.yaml -f compose.farmacias.yml config --quiet
            docker compose -f compose.yaml -f compose.farmacias.yml up -d --build --no-deps api web
            for i in $(seq 1 25); do
              if curl -fsS http://127.0.0.1:18080/api/health | grep -q ok; then exit 0; fi
              sleep 3
            done
            echo "API no responde al healthcheck"
            exit 1
          '
