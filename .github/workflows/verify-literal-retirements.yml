name: Temporal - Verificar SQL literal de bajas del preparador
on:
  push:
    branches: [diagnostic/verify-literal-retirements-20261028]
    paths: [".github/workflows/verify-literal-retirements.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/literal-baja-rules-preparador-and-responsive-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generar PREPARE desde SQL del preparador
        shell: bash
        run: |
          node --input-type=module > "$RUNNER_TEMP/verify.sql" <<'JS'
          import {readFileSync} from "node:fs";
          import {pharmacyDataCodeSQL} from "./api/src/pharmacyCodes.js";
          const sql=readFileSync("./api/src/preparadorLastReceipt.sql","utf8")
            .replaceAll("__SCHEMA__",'"ampedia"')
            .replaceAll("__PHARMACY_CODE__",pharmacyDataCodeSQL("f"));
          console.log("BEGIN READ ONLY;");
          console.log("SET LOCAL statement_timeout='9s';");
          console.log("PREPARE verify_stock_bajas(text,int[],text[]) AS "+sql);
          console.log("SELECT 'SQL_PREPARE_OK' AS result;");
          console.log("SELECT CASE WHEN position(upper('*BAJA*') in upper('Jarabe *BAJA* 10 ml'))>0 AND position(upper('*BAJA*') in upper('Jarabe BAJA 10 ml'))=0 THEN 'LITERAL_MATCH_OK' ELSE 'LITERAL_MISMATCH' END;");
          console.log("DEALLOCATE verify_stock_bajas;");
          console.log("ROLLBACK;");
          JS
      - name: Verificar PostgreSQL con permiso READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U farmawao -d farmawao' \
            < "$RUNNER_TEMP/verify.sql"
