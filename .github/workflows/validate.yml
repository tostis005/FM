          test "$(psql_test -At -c "SELECT cooperativa=false AND ignorar_informes=true FROM farmetrica.proveedores_maestro WHERE cliente_slug='ampedia' AND codigo_origen='COOP01'")" = t
          psql_test --single-transaction < api/src/migrations/test_operational_reports_fixture.sql
          psql_test -At -c "ALTER TABLE ampedia.articulos ADD COLUMN IF NOT EXISTS proveedor_habitual_id text;" >/dev/null
          # La tabla de artículos ya existe después del fixture de datos.
          # Crear el índice dos veces valida sintaxis, seguridad e idempotencia.
          psql_test < api/src/migrations/055_preparador_proveedor_idx.psql
          psql_test < api/src/migrations/055_preparador_proveedor_idx.psql
          test "$(psql_test -At -c "SELECT to_regclass('ampedia.articulos_fm_prep_proveedor_idx') IS NOT NULL")" = t
          # CONCURRENTLY no puede ejecutarse con --single-transaction.
          psql_test < api/src/migrations/045_promociones_busqueda_indices.psql
          psql_test < api/src/migrations/045_promociones_busqueda_indices.psql
          psql_test < api/src/migrations/046_verificar_indices_promociones.sql
          psql_test < ops/indices-preparador-masivo.sql
          psql_test < ops/indices-preparador-masivo.sql
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class i JOIN pg_namespace n ON n.oid=i.relnamespace JOIN pg_index x ON x.indexrelid=i.oid WHERE n.nspname='ampedia' AND i.relname='fm_lab_recepciones_proveedor_fecha_idx' AND x.indisvalid AND x.indisready")" = 1
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_index x ON x.indexrelid=c.oid WHERE n.nspname='ampedia' AND c.relname='fm_promociones_articulos_proveedor_idx' AND x.indisvalid AND x.indisready")" = 1
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class c
           JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_index i ON i.indexrelid=c.oid
           WHERE n.nspname='ampedia' AND c.relname IN ('fm_preparador_articulo_cn_idx',
             'fm_preparador_articulo_origen_idx','fm_preparador_ventas_linea_idx')
             AND i.indisvalid AND i.indisready")" -ge 3
          psql_test < api/src/migrations/037_proveedores_farmatic_faltantes.sql
          # CONCURRENTLY debe ejecutarse fuera de transacción; probar dos veces
          # para detectar índices duplicados, inválidos o migraciones no idempotentes.
          psql_test < ops/indices-documentales-concurrentes.sql
          psql_test < ops/indices-documentales-concurrentes.sql
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class idx
            JOIN pg_namespace ns ON ns.oid=idx.relnamespace
            JOIN pg_index ix ON ix.indexrelid=idx.oid
            WHERE ns.nspname='ampedia'
              AND idx.relname IN ('fm_doc_ventas_codigo_fecha_idx','fm_doc_recepciones_codigo_fecha_idx')
              AND ix.indisvalid AND ix.indisready;")" = 2
          psql_test < ops/indices-consultas-operativas.sql
          psql_test < ops/indices-consultas-operativas.sql
          test "$(psql_test -At -c "SELECT count(*) FROM pg_class i JOIN pg_namespace n ON n.oid=i.relnamespace JOIN pg_index x ON x.indexrelid=i.oid WHERE n.nspname='ampedia' AND i.relname=ANY(ARRAY['fm_ventas_codigo_fecha_idx','fm_articulos_codigo_id_sync_idx','fm_compras_codigo_fecha_idx','fm_proveedores_codigo_id_sync_idx','fm_ventas_codigo_articulo_fecha_idx','fm_compras_codigo_articulo_fecha_idx']) AND x.indisvalid;")" = 6
          # El fixture de PostgreSQL debe incluir el almacén y las migraciones actuales.
          psql_test --single-transaction < api/src/migrations/049_almacen_establecimiento.sql
          psql_test --single-transaction < api/src/migrations/074_nombre_informe_laboratorios.sql
          psql_test --single-transaction < api/src/migrations/065_demo_monofarmacia_y_vistas.sql
          psql_test --single-transaction < api/src/migrations/065_demo_monofarmacia_y_vistas.sql
          psql_test --single-transaction < api/src/migrations/068_almacenes_configurables_demo.sql
          psql_test --single-transaction < api/src/migrations/068_almacenes_configurables_demo.sql
          test "$(psql_test -At -c "SELECT count(*) FROM farmetrica.farmacias
           WHERE cliente_slug='demo_individual' AND codigo_origen='ALMACEN'
             AND tipo_establecimiento='almacen' AND activo=false")" = 1
          # La configuración manual debe sobrevivir a TODAS las migraciones
          # idempotentes: 0, 1 o varios almacenes a elección del cliente.
          psql_test -At -c "UPDATE farmetrica.farmacias SET activo=true
            WHERE cliente_slug='demo_individual' AND codigo_origen='ALMACEN'" >/dev/null
          psql_test --single-transaction < api/src/migrations/065_demo_monofarmacia_y_vistas.sql
          psql_test --single-transaction < api/src/migrations/068_almacenes_configurables_demo.sql
          test "$(psql_test -At -c "SELECT activo FROM farmetrica.farmacias
            WHERE cliente_slug='demo_individual' AND codigo_origen='ALMACEN'")" = t
          psql_test -At -c "UPDATE farmetrica.farmacias
            SET activo=false,tipo_establecimiento='farmacia'
            WHERE cliente_slug='demo_individual' AND codigo_origen='ALMACEN'" >/dev/null
