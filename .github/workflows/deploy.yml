name: Build and deploy Farmetrica

on:
  push:
    branches:
      - main
      - preview/farmetrica-v1
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmetrica-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar instalacion y compilacion
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node generate-seo.mjs
          node check-marketing.mjs
          npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY" || { echo "::error::Faltan VPS_HOST, VPS_USER o VPS_SSH_KEY"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/id_fm
          chmod 600 ~/.ssh/id_fm
          ssh-keygen -y -f ~/.ssh/id_fm >/dev/null
          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Comprobar permisos de destino
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             'test -d /opt/farmawao/web && test -w /opt/farmawao/web && cd /opt/farmawao && docker compose config --quiet && echo DESTINO_OK'
      - name: Preparar maestro de farmacias PostgreSQL (sin borrar datos)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 --single-transaction -U farmawao -d farmawao' \
            < api/src/migrations/001_farmacias.sql
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/farmawao && docker compose exec -T db psql -X -A -t -v ON_ERROR_STOP=1 -U farmawao -d farmawao -c "SELECT count(*) FROM public.farmacias WHERE id BETWEEN 1 AND 5;"' \
            | grep -qx 5
      - name: Subir codigo React (sin tocar Postgres)
        run: |
          set -euo pipefail
          tar -czf - -C web --exclude=node_modules --exclude=dist . | \
            ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'set -eu
             STAGING=$(mktemp -d)
             trap "rm -rf \"$STAGING\"" EXIT
             tar -xzf - -C "$STAGING"
             cp -r "$STAGING"/. /opt/farmawao/web/'
      - name: Reconstruir solo contenedor web
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             'cd /opt/farmawao && if test -f compose.farmacias.yml; then docker compose -f compose.yaml -f compose.farmacias.yml up -d --build --no-deps web; else docker compose up -d --build --no-deps web; fi'
      - name: Comprobar respuesta en VPS
        run: |
          ssh -i ~/.ssh/id_fm -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             'for i in $(seq 1 20); do
               status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ || true)
               blog=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/blog/ || true)
               post=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/blog/presentamos-farmetrica/ || true)
               solutions=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/soluciones/ || true)
               solution=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/soluciones/gestion-promociones-farmacia/ || true)
               integrations=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/integraciones/ || true)
               farmatic=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/integraciones/farmatic/ || true)
               guide=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/blog/indicadores-promociones-farmacia/ || true)
               sitemap=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/sitemap.xml || true)
               css=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/marketing.css || true)
               favicon=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/favicon.svg || true)
               login=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/login || true)
               private=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/index.html || true)
               panel=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/promociones || true)
               if [ "$status" = "200" ] && [ "$blog" = "200" ] && [ "$post" = "200" ] && [ "$solutions" = "200" ] && [ "$solution" = "200" ] && [ "$integrations" = "200" ] && [ "$farmatic" = "200" ] && [ "$guide" = "200" ] && [ "$sitemap" = "200" ] && [ "$css" = "200" ] && [ "$favicon" = "200" ] && [ "$login" = "200" ] && [ "$private" = "302" ] && [ "$panel" = "302" ]; then
                 if curl -fsS -D - -o /dev/null http://127.0.0.1:18080/login | tr -d "\r" | grep -Eqi "^content-type: text/html([;[:space:]]|$)" && \
                    curl -fsS http://127.0.0.1:18080/login | grep -q "Acceder a Farmetrica" && \
                    curl -fsS http://127.0.0.1:18080/ | grep -q "Cada promoción cuenta" && \
                    curl -fsS http://127.0.0.1:18080/blog/ | grep -q "Buenas ideas" && \
                    curl -fsS http://127.0.0.1:18080/soluciones/gestion-promociones-farmacia/ | grep -q "promociones" && \
                    curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q "<urlset"; then
                   exit 0
                 fi
               fi
               sleep 3
             done
             echo "Landing, blog, login o acceso privado no responden correctamente"
             exit 1'
